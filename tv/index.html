<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelTrack</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #f43f5e;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 0.5rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: var(--text-color);
            background: var(--accent);
            color: #0f172a;
            font-weight: 600;
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }

        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .poster-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .poster-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
        }

        .poster-image-container {
            width: 100%;
            aspect-ratio: 2/3;
            background-color: #334155;
            position: relative;
            overflow: hidden;
        }

        .poster-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .poster-title-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.9), transparent);
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            text-align: center;
        }

        .card-actions {
            padding: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            main {
                padding: 1rem;
            }
            .poster-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ReelTrack</h1>
        <nav>
            <button class="tab-btn active" onclick="switchTab('home')">Home</button>
            <button class="tab-btn" onclick="switchTab('library')">Library</button>
            <button class="tab-btn" onclick="switchTab('upcoming')">Upcoming</button>
            <button class="tab-btn" onclick="switchTab('watched')">Watched</button>
        </nav>
    </header>

    <main>
        <!-- Home Tab -->
        <section id="home" class="tab-content active">
            <h2 class="section-title">Continue Watching</h2>
            <div class="poster-grid" id="home-grid">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- Library Tab -->
        <section id="library" class="tab-content">
            <h2 class="section-title">TV Show Library</h2>
            <div class="poster-grid" id="library-grid">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- Upcoming Tab -->
        <section id="upcoming" class="tab-content">
            <h2 class="section-title">Upcoming Releases</h2>
            <div class="poster-grid" id="upcoming-grid">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- Watched Tab -->
        <section id="watched" class="tab-content">
            <h2 class="section-title">Completed & Watched</h2>
            <div class="poster-grid" id="watched-grid">
                <!-- Dynamically populated -->
            </div>
        </section>
    </main>

    <script>
        const shows = [
            { id: 1, title: "Only Murders in the Building", status: "home", img: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&auto=format&fit=crop&q=60" },
            { id: 2, title: "Every Year After", status: "home", img: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500&auto=format&fit=crop&q=60" },
            { id: 3, title: "Elle", status: "library", img: "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=500&auto=format&fit=crop&q=60" },
            { id: 4, title: "Sweet Magnolias", status: "upcoming", img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=500&auto=format&fit=crop&q=60" }
        ];

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderShows() {
            const homeGrid = document.getElementById('home-grid');
            const libraryGrid = document.getElementById('library-grid');
            const upcomingGrid = document.getElementById('upcoming-grid');
            const watchedGrid = document.getElementById('watched-grid');

            homeGrid.innerHTML = '';
            libraryGrid.innerHTML = '';
            upcomingGrid.innerHTML = '';
            watchedGrid.innerHTML = '';

            shows.forEach(show => {
                const card = document.createElement('div');
                card.className = 'poster-card';
                card.innerHTML = `
                    <div class="poster-image-container">
                        <img src="${show.img}" alt="${show.title}" onerror="this.src='https://via.placeholder.com/500x750?text=No+Image'">
                        <div class="poster-title-overlay">${show.title}</div>
                    </div>
                    <div class="card-actions">
                        <span style="font-size:0.75rem; color:var(--text-muted);">${show.status.toUpperCase()}</span>
                        <button class="btn" onclick="alert('${show.title}')">View</button>
                    </div>
                `;

                if (show.status === 'home') homeGrid.appendChild(card);
                if (show.status === 'library' || show.status === 'home') libraryGrid.appendChild(card);
                if (show.status === 'upcoming') upcomingGrid.appendChild(card);
                if (show.status === 'watched') watchedGrid.appendChild(card);
            });
        }

        renderShows();
    </script>
</body>
</html>
