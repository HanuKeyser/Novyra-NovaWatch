<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05070b">
<title>ReelTrack</title>

<style>
/* =========================================================
   RESET & VARIABLES
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #05070b;
    --surface: #0b0f16;
    --surface-2: #101620;
    --surface-3: #151c28;

    --blue: #1677ff;
    --blue-light: #4b9aff;
    --blue-dark: #0d4fb5;

    --text: #ffffff;
    --text-secondary: #8d96a5;
    --text-muted: #5f6876;

    --border: rgba(255,255,255,0.07);

    --success: #24d17e;
    --danger: #ff5268;

    --radius: 16px;
}

html {
    background: var(--bg);
    color-scheme: dark;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #070a10 0%,
            #05070b 100%
        );

    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 86px;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    color: inherit;
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
    opacity: 0.45;
}

img {
    display: block;
    max-width: 100%;
}

/* =========================================================
   SVG ICONS
========================================================= */

.icon {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.icon-small {
    width: 17px;
    height: 17px;
}

.icon-large {
    width: 30px;
    height: 30px;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    max-width: 600px;
    min-height: 100vh;
    margin: 0 auto;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 50;

    height: 68px;
    padding: 0 17px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(5,7,11,0.9);
    backdrop-filter: blur(20px);

    border-bottom: 1px solid var(--border);
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.6px;
}

.logo-mark {
    width: 33px;
    height: 33px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            #0052d4
        );

    box-shadow:
        0 6px 20px
        rgba(22,119,255,0.3);
}

.profile-button {
    width: 39px;
    height: 39px;

    border-radius: 50%;
    overflow: hidden;

    background: var(--surface-3);
    border: 1px solid var(--border);
}

.profile-avatar {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            #003f9e
        );

    font-size: 14px;
    font-weight: 800;
}

/* =========================================================
   PAGES
========================================================= */

.page {
    display: none;
    padding: 20px 16px 30px;
}

.page.active {
    display: block;
}

/* =========================================================
   SECTIONS
========================================================= */

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin: 26px 0 14px;
}

.section-header:first-child {
    margin-top: 0;
}

.section-title {
    font-size: 18px;
    font-weight: 750;
    letter-spacing: -0.4px;
}

.section-link {
    background: transparent;
    color: var(--blue-light);

    font-size: 13px;
    font-weight: 650;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;
    min-height: 325px;

    overflow: hidden;
    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #101827,
            #080b11
        );

    border: 1px solid var(--border);
}

.hero-image {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    opacity: 0.5;
}

.hero-image.hidden {
    display: none;
}

.hero-overlay {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(5,7,11,0.05),
            rgba(5,7,11,0.98)
        );
}

.hero-content {
    position: relative;
    z-index: 2;

    min-height: 325px;
    padding: 22px;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

.hero-label {
    color: var(--blue-light);

    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.3px;
    text-transform: uppercase;

    margin-bottom: 8px;
}

.hero-title {
    font-size: 28px;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -1px;

    margin-bottom: 9px;
}

.hero-description {
    max-width: 410px;

    color: var(--text-secondary);

    font-size: 13px;
    line-height: 1.5;

    margin-bottom: 16px;
}

.primary-button {
    width: fit-content;
    min-height: 45px;

    padding: 0 18px;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    border-radius: 12px;

    background: var(--blue);

    font-size: 13px;
    font-weight: 700;

    box-shadow:
        0 8px 25px
        rgba(22,119,255,0.25);
}

.primary-button:active {
    transform: scale(0.97);
}

/* =========================================================
   STATS
========================================================= */

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;

    margin-top: 14px;
}

.stat {
    padding: 16px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
}

.stat-value {
    font-size: 23px;
    font-weight: 800;
}

.stat-label {
    color: var(--text-secondary);
    font-size: 11px;

    margin-top: 4px;
}

/* =========================================================
   HORIZONTAL ROW
========================================================= */

.horizontal-row {
    display: flex;
    gap: 12px;

    overflow-x: auto;

    padding-bottom: 5px;

    scrollbar-width: none;
}

.horizontal-row::-webkit-scrollbar {
    display: none;
}

/* =========================================================
   CARDS
========================================================= */

.card {
    flex: 0 0 125px;
    width: 125px;

    cursor: pointer;
}

.poster {
    position: relative;

    width: 125px;
    height: 178px;

    overflow: hidden;

    border-radius: 13px;

    background:
        linear-gradient(
            145deg,
            #182131,
            #0b0e14
        );

    border: 1px solid var(--border);
}

.poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.poster-placeholder {
    width: 100%;
    height: 100%;

    padding: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    color: var(--text-secondary);

    font-size: 11px;
    font-weight: 700;
}

.card-title {
    margin-top: 9px;

    font-size: 12px;
    font-weight: 650;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-meta {
    margin-top: 4px;

    color: var(--text-muted);

    font-size: 10px;
}

.progress-bar {
    width: 100%;
    height: 3px;

    margin-top: 7px;

    overflow: hidden;

    border-radius: 5px;

    background:
        rgba(255,255,255,0.08);
}

.progress-fill {
    height: 100%;
    background: var(--blue);
}

/* =========================================================
   3 COLUMN GRID
========================================================= */

.library-grid {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 18px 10px;
}

.library-grid .card {
    width: 100%;
    min-width: 0;
}

.library-grid .poster {
    width: 100%;
    height: auto;

    aspect-ratio: 0.70;
}

/* =========================================================
   TABS
========================================================= */

.library-tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);

    gap: 5px;

    padding: 4px;

    margin-bottom: 18px;

    background: var(--surface);

    border-radius: 12px;
}

.library-tab {
    height: 40px;

    border-radius: 9px;

    background: transparent;

    color: var(--text-secondary);

    font-size: 12px;
    font-weight: 700;
}

.library-tab.active {
    background: var(--blue);
    color: white;
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state {
    padding: 55px 20px;

    text-align: center;

    color: var(--text-secondary);
}

.empty-state svg {
    margin-bottom: 15px;
    color: var(--text-muted);
}

.empty-state h3 {
    color: var(--text);

    font-size: 16px;

    margin-bottom: 7px;
}

.empty-state p {
    font-size: 12px;
    line-height: 1.5;
}

/* =========================================================
   SEARCH
========================================================= */

.search-box {
    position: relative;

    margin-bottom: 18px;
}

.search-box input {
    width: 100%;
    height: 48px;

    padding: 0 16px 0 45px;

    outline: none;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: 14px;

    color: white;
}

.search-box input:focus {
    border-color:
        rgba(22,119,255,0.6);
}

.search-icon {
    position: absolute;

    left: 16px;
    top: 50%;

    transform:
        translateY(-50%);

    color: var(--text-muted);
}

/* =========================================================
   UPCOMING
========================================================= */

.upcoming-card {
    display: flex;
    gap: 12px;

    padding: 12px;

    margin-bottom: 10px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: 14px;

    cursor: pointer;
}

.upcoming-poster {
    flex: 0 0 62px;

    width: 62px;
    height: 88px;

    overflow: hidden;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #182131,
            #0b0e14
        );
}

.upcoming-poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.upcoming-poster-placeholder {
    width: 100%;
    height: 100%;

    padding: 6px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    color: var(--text-secondary);

    font-size: 8px;
    font-weight: 700;
}

.upcoming-info {
    flex: 1;
    min-width: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.upcoming-type {
    color: var(--blue-light);

    font-size: 9px;
    font-weight: 800;

    text-transform: uppercase;
    letter-spacing: 0.8px;

    margin-bottom: 5px;
}

.upcoming-title {
    font-size: 13px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.upcoming-date {
    color: var(--text-secondary);

    font-size: 10px;
    line-height: 1.5;

    margin-top: 6px;
}

.upcoming-countdown {
    color: var(--text-muted);

    font-size: 10px;

    margin-top: 3px;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav {
    position: fixed;

    left: 50%;
    bottom: 0;

    transform:
        translateX(-50%);

    z-index: 100;

    width: 100%;
    max-width: 600px;

    height: 72px;

    padding: 7px 12px;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    background:
        rgba(8,11,17,0.95);

    backdrop-filter: blur(20px);

    border-top:
        1px solid var(--border);
}

.nav-button {
    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 4px;

    background: transparent;

    color: var(--text-muted);

    font-size: 9px;
    font-weight: 650;
}

.nav-button.active {
    color: var(--blue-light);
}

/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;
    inset: 0;

    z-index: 200;

    display: none;
    align-items: flex-end;

    background:
        rgba(0,0,0,0.7);
}

.modal.open {
    display: flex;
}

.modal-sheet {
    width: 100%;
    max-width: 600px;
    max-height: 92vh;

    margin: 0 auto;

    overflow-y: auto;

    background:
        #090d14;

    border-radius:
        24px 24px 0 0;

    border:
        1px solid var(--border);
}

.modal-header {
    position: sticky;
    top: 0;

    z-index: 5;

    height: 55px;

    display: flex;
    align-items: center;
    justify-content: flex-end;

    padding: 0 15px;

    background:
        rgba(9,13,20,0.9);

    backdrop-filter:
        blur(15px);
}

.close-button {
    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: var(--surface-3);

    color: var(--text-secondary);
}

.modal-backdrop {
    width: 100%;
    height: 220px;

    object-fit: cover;

    background:
        linear-gradient(
            145deg,
            #152033,
            #080b10
        );
}

.modal-content {
    padding: 20px;
}

.modal-title {
    font-size: 25px;
    font-weight: 800;

    letter-spacing: -0.7px;
}

.modal-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;

    color: var(--text-secondary);

    font-size: 11px;

    margin: 9px 0 16px;
}

.modal-description {
    color: var(--text-secondary);

    font-size: 13px;
    line-height: 1.6;
}

.modal-actions {
    display: flex;
    gap: 8px;

    margin: 20px 0;
}

.action-button {
    flex: 1;

    min-height: 43px;

    border-radius: 11px;

    background: var(--surface-3);

    color: white;

    font-size: 12px;
    font-weight: 700;
}

.action-button.primary {
    background: var(--blue);
}

.season-selector {
    display: flex;
    gap: 7px;

    overflow-x: auto;

    margin: 20px 0 14px;

    scrollbar-width: none;
}

.season-selector::-webkit-scrollbar {
    display: none;
}

.season-button {
    flex: 0 0 auto;

    height: 36px;

    padding: 0 14px;

    border-radius: 9px;

    background: var(--surface-3);

    color: var(--text-secondary);

    font-size: 11px;
    font-weight: 700;
}

.season-button.active {
    background: var(--blue);
    color: white;
}

.season-button.upcoming {
    color: var(--blue-light);
}

.episode {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 13px 0;

    border-bottom:
        1px solid var(--border);
}

.episode-check {
    flex: 0 0 29px;

    width: 29px;
    height: 29px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border:
        1px solid var(--text-muted);

    background: transparent;

    color: white;
}

.episode-check.watched {
    background: var(--blue);
    border-color: var(--blue);
}

.episode-info {
    min-width: 0;
}

.episode-title {
    font-size: 12px;
    font-weight: 650;
}

.episode-meta {
    color: var(--text-muted);

    font-size: 10px;

    line-height: 1.5;

    margin-top: 4px;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-card {
    padding: 20px;

    background: var(--surface);

    border:
        1px solid var(--border);

    border-radius: var(--radius);
}

.profile-row {
    display: flex;
    align-items: center;
    gap: 14px;
}

.large-avatar {
    width: 58px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            #0045a9
        );

    font-size: 20px;
    font-weight: 800;
}

.profile-name {
    font-size: 17px;
    font-weight: 750;
}

.profile-subtitle {
    color: var(--text-secondary);

    font-size: 11px;

    margin-top: 4px;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 88px;

    z-index: 500;

    transform:
        translateX(-50%)
        translateY(20px);

    opacity: 0;

    pointer-events: none;

    padding: 11px 16px;

    border-radius: 10px;

    background: #161d29;

    border:
        1px solid var(--border);

    color: white;

    font-size: 12px;
    font-weight: 600;

    transition:
        0.25s ease;

    white-space: nowrap;
}

.toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 360px) {

    .page {
        padding-left: 12px;
        padding-right: 12px;
    }

    .library-grid {
        gap: 14px 7px;
    }

    .hero-title {
        font-size: 24px;
    }

}

@media (min-width: 601px) {

    body {
        background:
            #020408;
    }

    .app {
        background:
            var(--bg);

        box-shadow:
            0 0 50px
            rgba(0,0,0,0.5);
    }

}

</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo">

        <div class="logo-mark">

            <svg class="icon" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="16" rx="3"/>
                <path d="M8 4v16"/>
                <path d="M16 4v16"/>
            </svg>

        </div>

        ReelTrack

    </div>

    <button
        class="profile-button"
        onclick="showPage('profile')"
        aria-label="Open profile"
    >

        <div
            class="profile-avatar"
            id="headerAvatar"
        >
            H
        </div>

    </button>

</header>


<!-- =====================================================
     HOME
===================================================== -->

<main id="homePage" class="page active">

    <section class="hero">

        <img
            id="heroImage"
            class="hero-image hidden"
            alt=""
        >

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <div class="hero-label">
                Continue Watching
            </div>

            <h1
                id="heroTitle"
                class="hero-title"
            >
                Welcome to ReelTrack
            </h1>

            <p
                id="heroDescription"
                class="hero-description"
            >
                Track every movie and TV show your household watches.
            </p>

            <button
                class="primary-button"
                onclick="continueWatching()"
            >

                <svg class="icon icon-small" viewBox="0 0 24 24">
                    <path d="M8 5l11 7-11 7V5z"/>
                </svg>

                Continue Watching

            </button>

        </div>

    </section>


    <div
        id="dashboardStats"
        class="stats"
    ></div>


    <div>

        <div class="section-header">

            <div class="section-title">
                Continue TV Shows
            </div>

            <button
                class="section-link"
                onclick="openLibrary('tv')"
            >
                See All
            </button>

        </div>

        <div
            id="continueTVGrid"
            class="horizontal-row"
        ></div>

    </div>


    <div>

        <div class="section-header">

            <div class="section-title">
                Upcoming
            </div>

            <button
                class="section-link"
                onclick="showPage('upcoming')"
            >
                See All
            </button>

        </div>

        <div id="homeUpcoming"></div>

    </div>

</main>


<!-- =====================================================
     LIBRARY
===================================================== -->

<main id="libraryPage" class="page">

    <div class="section-header">

        <div class="section-title">
            Library
        </div>

    </div>


    <div class="search-box">

        <svg class="icon search-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-4-4"/>
        </svg>

        <input
            id="librarySearchInput"
            type="search"
            placeholder="Search your library..."
            autocomplete="off"
        >

    </div>


    <div class="library-tabs">

        <button
            id="moviesTab"
            class="library-tab active"
            onclick="setLibraryType('movie')"
        >
            Movies
        </button>

        <button
            id="tvTab"
            class="library-tab"
            onclick="setLibraryType('tv')"
        >
            TV Shows
        </button>

    </div>


    <div
        id="libraryGrid"
        class="library-grid"
    ></div>

</main>


<!-- =====================================================
     WATCHED
===================================================== -->

<main id="watchedPage" class="page">

    <div class="section-header">

        <div class="section-title">
            Watched
        </div>

    </div>


    <div class="library-tabs">

        <button
            id="watchMovieTab"
            class="library-tab active"
            onclick="setWatchedType('movie')"
        >
            Movies
        </button>

        <button
            id="watchTVTab"
            class="library-tab"
            onclick="setWatchedType('tv')"
        >
            TV Shows
        </button>

    </div>


    <div
        id="watchedGrid"
        class="library-grid"
    ></div>

</main>


<!-- =====================================================
     UPCOMING
===================================================== -->

<main id="upcomingPage" class="page">

    <div class="section-header">

        <div class="section-title">
            Upcoming
        </div>

    </div>


    <div class="library-tabs">

        <button
            id="upcomingTVTab"
            class="library-tab active"
            onclick="setUpcomingType('tv')"
        >
            TV Shows

<script>

/* =========================================================
   APP STATE
========================================================= */

const STORAGE_KEY =
    "reeltrack_data_v3";

let state = {
    movies: [],
    tvShows: [],
    profiles: [
        {
            id: "profile-hanu",
            name: "Hanu",
            initials: "H"
        }
    ],
    activeProfileId: "profile-hanu"
};

let currentLibraryType = "movie";
let currentWatchedType = "movie";
let currentUpcomingType = "tv";

let currentItem = null;
let selectedSeason = 1;
let toastTimer = null;


/* =========================================================
   DATE HELPERS
========================================================= */

function now() {
    return new Date();
}

function isReleased(date) {
    if (!date) return true;
    return new Date(date).getTime() <= now().getTime();
}

function formatDate(date) {

    return new Intl.DateTimeFormat(
        "en-ZA",
        {
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    ).format(new Date(date));

}

function formatReleaseDate(date) {

    return new Intl.DateTimeFormat(
        "en-ZA",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    ).format(new Date(date));

}

function getCountdown(date) {

    const difference =
        new Date(date).getTime() -
        now().getTime();

    if (difference <= 0) {
        return "Available now";
    }

    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );

    const hours =
        Math.floor(
            (
                difference %
                (1000 * 60 * 60 * 24)
            ) /
            (1000 * 60 * 60)
        );

    const minutes =
        Math.floor(
            (
                difference %
                (1000 * 60 * 60)
            ) /
            (1000 * 60)
        );

    if (days > 0) {
        return `${days}d ${hours}h until release`;
    }

    if (hours > 0) {
        return `${hours}h ${minutes}m until release`;
    }

    return `${minutes}m until release`;

}


/* =========================================================
   STORAGE
========================================================= */

function saveState() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(state)
        );

    } catch (error) {

        console.error(
            "Could not save data:",
            error
        );

        showToast(
            "Could not save changes"
        );

    }

}


function loadState() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {
            return;
        }

        const parsed =
            JSON.parse(saved);

        if (
            parsed &&
            typeof parsed === "object"
        ) {

            state = {
                ...state,
                ...parsed
            };

        }

    } catch (error) {

        console.error(
            "Could not load saved data:",
            error
        );

        localStorage.removeItem(
            STORAGE_KEY
        );

    }

}


/* =========================================================
   DEMO DATA
========================================================= */

function createDemoData() {

    const hasTV =
        state.tvShows.some(
            show =>
                show.id ===
                "placeholder-tv-show"
        );


    if (!hasTV) {

        const show = {

            id:
                "placeholder-tv-show",

            type:
                "tv",

            ownerId:
                state.activeProfileId,

            title:
                "The Placeholder",

            year:
                "2026",

            poster:
                "",

            backdrop:
                "",

            description:
                "A placeholder TV show used to test the ReelTrack tracking system.",

            episodes:
                []

        };


        for (
            let season = 1;
            season <= 2;
            season++
        ) {

            for (
                let episode = 1;
                episode <= 10;
                episode++
            ) {

                show.episodes.push({

                    id:
                        `s${season}e${episode}`,

                    season:
                        season,

                    number:
                        episode,

                    title:
                        `Episode ${episode}`,

                    runtime:
                        "45 min",

                    watched:
                        false,

                    releaseDate:
                        null

                });

            }

        }


        const startDate =
            new Date(
                "2026-08-03T20:00:00"
            );


        for (
            let episode = 1;
            episode <= 10;
            episode++
        ) {

            const releaseDate =
                new Date(
                    startDate
                );

            releaseDate.setDate(
                startDate.getDate() +
                (
                    (episode - 1) * 7
                )
            );


            show.episodes.push({

                id:
                    `s3e${episode}`,

                season:
                    3,

                number:
                    episode,

                title:
                    `Episode ${episode}`,

                runtime:
                    "45 min",

                watched:
                    false,

                releaseDate:
                    releaseDate.toISOString()

            });

        }


        state.tvShows.push(
            show
        );

    }


    const hasPlaceholderMovie =
        state.movies.some(
            movie =>
                movie.id ===
                "placeholder-movie"
        );


    if (!hasPlaceholderMovie) {

        state.movies.push({

            id:
                "placeholder-movie",

            type:
                "movie",

            ownerId:
                state.activeProfileId,

            title:
                "The Placeholder Movie",

            year:
                "2026",

            poster:
                "",

            backdrop:
                "",

            description:
                "A placeholder movie for testing ReelTrack.",

            watched:
                false,

            releaseDate:
                null

        });

    }


    const hasUpcomingMovie =
        state.movies.some(
            movie =>
                movie.id ===
                "upcoming-movie-2026"
        );


    if (!hasUpcomingMovie) {

        state.movies.push({

            id:
                "upcoming-movie-2026",

            type:
                "movie",

            ownerId:
                state.activeProfileId,

            title:
                "The Upcoming Movie",

            year:
                "2026",

            poster:
                "",

            backdrop:
                "",

            description:
                "An upcoming movie scheduled for release on 5 October 2026.",

            watched:
                false,

            releaseDate:
                "2026-10-05T00:00:00"

        });

    }


    saveState();

}


/* =========================================================
   DATA HELPERS
========================================================= */

function getItem(
    type,
    id
) {

    const collection =
        type === "movie"
            ? state.movies
            : state.tvShows;

    return collection.find(
        item =>
            item.id === id
    );

}


function getAvailableEpisodes(show) {

    return show.episodes.filter(
        episode =>
            isReleased(
                episode.releaseDate
            )
    );

}


function getUpcomingEpisodes(show = null) {

    const results = [];

    const shows =
        show
            ? [show]
            : state.tvShows;

    shows.forEach(
        currentShow => {

            currentShow.episodes
                .filter(
                    episode =>
                        episode.releaseDate &&
                        !isReleased(
                            episode.releaseDate
                        )
                )
                .forEach(
                    episode => {

                        results.push({

                            show:
                                currentShow,

                            episode:
                                episode,

                            date:
                                new Date(
                                    episode.releaseDate
                                )

                        });

                    }
                );

        }
    );


    return results.sort(
        (a, b) =>
            a.date - b.date
    );

}


function getUpcomingMovies() {

    return state.movies
        .filter(
            movie =>
                movie.releaseDate &&
                !isReleased(
                    movie.releaseDate
                )
        )
        .sort(
            (a, b) =>
                new Date(
                    a.releaseDate
                ) -
                new Date(
                    b.releaseDate
                )
        );

}


function getTVProgress(show) {

    const available =
        getAvailableEpisodes(
            show
        );

    const watched =
        available.filter(
            episode =>
                episode.watched
        );

    const nextEpisode =
        available.find(
            episode =>
                !episode.watched
        );

    return {

        total:
            available.length,

        watched:
            watched.length,

        percentage:
            available.length
                ? Math.round(
                    (
                        watched.length /
                        available.length
                    ) * 100
                )
                : 0,

        nextEpisode:
            nextEpisode

    };

}


function isTVFinished(show) {

    const progress =
        getTVProgress(
            show
        );

    return (
        progress.total > 0 &&
        progress.watched ===
        progress.total
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page) {

    document
        .querySelectorAll(".page")
        .forEach(
            element =>
                element.classList.remove(
                    "active"
                )
        );


    const target =
        document.getElementById(
            `${page}Page`
        );


    if (target) {

        target.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(".nav-button")
        .forEach(
            button =>
                button.classList.remove(
                    "active"
                )
        );


    const nav =
        document.getElementById(
            `nav${page
                .charAt(0)
                .toUpperCase()}${page.slice(1)}`
        );


    if (nav) {

        nav.classList.add(
            "active"
        );

    }


    if (page === "home") {
        renderDashboard();
    }

    if (page === "library") {
        renderLibrary();
    }

    if (page === "watched") {
        renderWatched();
    }

    if (page === "upcoming") {
        renderUpcoming();
    }

    if (page === "profile") {
        renderProfile();
    }

}


/* =========================================================
   LIBRARY
========================================================= */

function openLibrary(type) {

    currentLibraryType =
        type;

    showPage(
        "library"
    );

}


function setLibraryType(type) {

    currentLibraryType =
        type;


    document
        .getElementById(
            "moviesTab"
        )
        .classList.toggle(
            "active",
            type === "movie"
        );


    document
        .getElementById(
            "tvTab"
        )
        .classList.toggle(
            "active",
            type === "tv"
        );


    renderLibrary();

}


function renderLibrary() {

    const grid =
        document.getElementById(
            "libraryGrid"
        );

    const searchInput =
        document.getElementById(
            "librarySearchInput"
        );

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    let items =
        currentLibraryType === "movie"
            ? state.movies
            : state.tvShows;


    /*
       Released movies only appear
       in the main Movies library.
    */

    if (
        currentLibraryType ===
        "movie"
    ) {

        items =
            items.filter(
                movie =>
                    isReleased(
                        movie.releaseDate
                    )
            );

    }


    if (query) {

        items =
            items.filter(
                item =>
                    item.title
                        .toLowerCase()
                        .includes(
                            query
                        )
            );

    }


    if (!items.length) {

        grid.innerHTML =
            emptyState(
                currentLibraryType ===
                "movie"
                    ? "No Movies Found"
                    : "No TV Shows Found"
            );

        return;

    }


    grid.innerHTML =
        items
            .map(
                item =>
                    createCard(
                        item,
                        currentLibraryType
                    )
            )
            .join("");

}


/* =========================================================
   WATCHED
========================================================= */

function setWatchedType(type) {

    currentWatchedType =
        type;


    document
        .getElementById(
            "watchMovieTab"
        )
        .classList.toggle(
            "active",
            type === "movie"
        );


    document
        .getElementById(
            "watchTVTab"
        )
        .classList.toggle(
            "active",
            type === "tv"
        );


    renderWatched();

}


function renderWatched() {

    const grid =
        document.getElementById(
            "watchedGrid"
        );


    let items;


    if (
        currentWatchedType ===
        "movie"
    ) {

        items =
            state.movies.filter(
                movie =>
                    movie.watched
            );

    } else {

        items =
            state.tvShows.filter(
                show =>
                    isTVFinished(
                        show
                    )
            );

    }


    if (!items.length) {

        grid.innerHTML =
            emptyState(
                currentWatchedType ===
                "movie"
                    ? "No Movies Watched"
                    : "No TV Shows Finished"
            );

        return;

    }


    grid.innerHTML =
        items
            .map(
                item =>
                    createCard(
                        item,
                        currentWatchedType
                    )
            )
            .join("");

}


/* =========================================================
   UPCOMING
========================================================= */

function setUpcomingType(type) {

    currentUpcomingType =
        type;


    document
        .getElementById(
            "upcomingTVTab"
        )
        .classList.toggle(
            "active",
            type === "tv"
        );


    document
        .getElementById(
            "upcomingMovieTab"
        )
        .classList.toggle(
            "active",
            type === "movie"
        );


    renderUpcoming();

}


function renderUpcoming() {

    const container =
        document.getElementById(
            "upcomingGrid"
        );


    if (
        currentUpcomingType ===
        "tv"
    ) {

        const episodes =
            getUpcomingEpisodes();


        if (!episodes.length) {

            container.innerHTML =
                emptyState(
                    "No Upcoming TV Episodes"
                );

            return;

        }


        container.innerHTML =
            episodes
                .map(
                    data =>
                        createUpcomingTVCard(
                            data
                        )
                )
                .join("");

    } else {

        const movies =
            getUpcomingMovies();


        if (!movies.length) {

            container.innerHTML =
                emptyState(
                    "No Upcoming Movies"
                );

            return;

        }


        container.innerHTML =
            movies
                .map(
                    movie =>
                        createUpcomingMovieCard(
                            movie
                        )
                )
                .join("");

    }

}


/* =========================================================
   UPCOMING CARDS
========================================================= */

function createUpcomingTVCard(data) {

    const show =
        data.show;

    const episode =
        data.episode;


    return `

        <div
            class="upcoming-card"
            onclick="
                openDetails(
                    'tv',
                    '${show.id}'
                )
            "
        >

            <div class="upcoming-poster">

                ${
                    show.poster

                        ? `
                            <img
                                src="${show.poster}"
                                alt="${escapeHTML(
                                    show.title
                                )}"
                            >
                        `

                        : `
                            <div
                                class="
                                    upcoming-poster-placeholder
                                "
                            >
                                ${escapeHTML(
                                    show.title
                                )}
                            </div>
                        `
                }

            </div>


            <div class="upcoming-info">

                <div class="upcoming-type">
                    TV Show
                </div>

                <div class="upcoming-title">
                    ${escapeHTML(
                        show.title
                    )}
                </div>

                <div class="upcoming-date">

                    Season
                    ${episode.season}
                    ·
                    Episode
                    ${episode.number}

                    <br>

                    ${formatDate(
                        episode.releaseDate
                    )}

                </div>

                <div class="upcoming-countdown">

                    ${getCountdown(
                        episode.releaseDate
                    )}

                </div>

            </div>

        </div>

    `;

}


function createUpcomingMovieCard(movie) {

    return `

        <div
            class="upcoming-card"
            onclick="
                openDetails(
                    'movie',
                    '${movie.id}'
                )
            "
        >

            <div class="upcoming-poster">

                ${
                    movie.poster

                        ? `
                            <img
                                src="${movie.poster}"
                                alt="${escapeHTML(
                                    movie.title
                                )}"
                            >
                        `

                        : `
                            <div
                                class="
                                    upcoming-poster-placeholder
                                "
                            >
                                ${escapeHTML(
                                    movie.title
                                )}
                            </div>
                        `
                }

            </div>


            <div class="upcoming-info">

                <div class="upcoming-type">
                    Movie
                </div>

                <div class="upcoming-title">
                    ${escapeHTML(
                        movie.title
                    )}
                </div>

                <div class="upcoming-date">

                    Release Date

                    <br>

                    ${formatReleaseDate(
                        movie.releaseDate
                    )}

                </div>

                <div class="upcoming-countdown">

                    ${getCountdown(
                        movie.releaseDate
                    )}

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   HOME
========================================================= */

function renderDashboard() {

    const watchedMovies =
        state.movies.filter(
            movie =>
                movie.watched
        );


    const watchedEpisodes =
        state.tvShows.reduce(
            (
                total,
                show
            ) =>
                total +
                getTVProgress(
                    show
                ).watched,
            0
        );


    document
        .getElementById(
            "dashboardStats"
        )
        .innerHTML = `

            <div class="stat">

                <div class="stat-value">
                    ${watchedMovies.length}
                </div>

                <div class="stat-label">
                    Movies Watched
                </div>

            </div>


            <div class="stat">

                <div class="stat-value">
                    ${watchedEpisodes}
                </div>

                <div class="stat-label">
                    Episodes Watched
                </div>

            </div>

        `;


    const continueShows =
        state.tvShows.filter(
            show => {

                const progress =
                    getTVProgress(
                        show
                    );

                return (
                    progress.watched >
                    0 &&
                    !isTVFinished(
                        show
                    )
                );

            }
        );


    const displayShows =
        continueShows.length
            ? continueShows
            : state.tvShows.filter(
                show =>
                    !isTVFinished(
                        show
                    )
            );


    renderRow(
        "continueTVGrid",
        displayShows
    );


    const firstShow =
        continueShows[0];


    if (firstShow) {

        const progress =
            getTVProgress(
                firstShow
            );


        document
            .getElementById(
                "heroTitle"
            )
            .textContent =
            firstShow.title;


        document
            .getElementById(
                "heroDescription"
            )
            .textContent =
            progress.nextEpisode
                ? `Continue with Season ${progress.nextEpisode.season}, Episode ${progress.nextEpisode.number}.`
                : "Continue watching this TV show.";

    } else {

        document
            .getElementById(
                "heroTitle"
            )
            .textContent =
            "Welcome to ReelTrack";


        document
            .getElementById(
                "heroDescription"
            )
            .textContent =
            "Track every movie and TV show your household watches.";

    }


    renderHomeUpcoming();

}


function renderRow(
    elementId,
    items
) {

    const container =
        document.getElementById(
            elementId
        );


    if (!items.length) {

        container.innerHTML = `

            <div
                style="
                    color: var(--text-muted);
                    font-size: 12px;
                    padding: 15px 0;
                "
            >
                No TV shows to continue yet.
            </div>

        `;

        return;

    }


    container.innerHTML =
        items
            .map(
                item =>
                    createCard(
                        item,
                        "tv"
                    )
            )
            .join("");

}


function renderHomeUpcoming() {

    const container =
        document.getElementById(
            "homeUpcoming"
        );


    const tvEpisodes =
        getUpcomingEpisodes();


    const movies =
        getUpcomingMovies();


    const items = [];


    if (tvEpisodes.length) {

        items.push(
            createUpcomingTVCard(
                tvEpisodes[0]
            )
        );

    }


    if (movies.length) {

        items.push(
            createUpcomingMovieCard(
                movies[0]
            )
        );

    }


    if (!items.length) {

        container.innerHTML =
            emptyState(
                "Nothing Upcoming"
            );

        return;

    }


    container.innerHTML =
        items.join("");

}


/* =========================================================
   CARD
========================================================= */

function createCard(
    item,
    type
) {

    let meta = "";


    if (
        type ===
        "movie"
    ) {

        meta =
            item.watched
                ? "Watched"
                : "Not watched";

    } else {

        const progress =
            getTVProgress(
                item
            );


        meta =
            `${progress.watched}/${progress.total} episodes`;

    }


    let progressHTML =
        "";


    if (
        type ===
        "tv"
    ) {

        const progress =
            getTVProgress(
                item
            );


        progressHTML = `

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    style="
                        width:
                        ${progress.percentage}%;
                    "
                ></div>

            </div>

        `;

    }


    return `

        <div
            class="card"
            onclick="
                openDetails(
                    '${type}',
                    '${item.id}'
                )
            "
        >

            <div class="poster">

                ${
                    item.poster

                        ? `
                            <img
                                src="${item.poster}"
                                alt="${escapeHTML(
                                    item.title
                                )}"
                            >
                        `

                        : `
                            <div
                                class="
                                    poster-placeholder
                                "
                            >
                                ${escapeHTML(
                                    item.title
                                )}
                            </div>
                        `
                }

            </div>


            <div class="card-title">
                ${escapeHTML(
                    item.title
                )}
            </div>


            <div class="card-meta">
                ${meta}
            </div>


            ${progressHTML}

        </div>

    `;

}


/* =========================================================
   CONTINUE WATCHING
========================================================= */

function continueWatching() {

    const show =
        state.tvShows.find(
            currentShow => {

                const progress =
                    getTVProgress(
                        currentShow
                    );

                return (
                    progress.watched >
                    0 &&
                    progress.nextEpisode
                );

            }
        );


    if (show) {

        openDetails(
            "tv",
            show.id
        );

        return;

    }


    showToast(
        "Nothing to continue watching"
    );

}


/* =========================================================
   DETAILS
========================================================= */

function openDetails(
    type,
    id
) {

    const item =
        getItem(
            type,
            id
        );


    if (!item) {
        return;
    }


    currentItem = {
        type,
        id
    };


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        item.title;


    document
        .getElementById(
            "modalDescription"
        )
        .textContent =
        item.description ||
        "No description available.";


    document
        .getElementById(
            "modalMeta"
        )
        .innerHTML = `

            <span>
                ${
                    type === "tv"
                        ? "TV Show"
                        : "Movie"
                }
            </span>

            <span>•</span>

            <span>
                ${item.year}
            </span>

        `;


    const backdrop =
        document.getElementById(
            "modalBackdrop"
        );


    if (item.backdrop) {

        backdrop.src =
            item.backdrop;

        backdrop.style.display =
            "block";

    } else {

        backdrop.removeAttribute(
            "src"
        );

        backdrop.style.display =
            "block";

    }


    renderModalActions(
        item,
        type
    );


    if (
        type === "tv"
    ) {

        renderEpisodes(
            item
        );

    } else {

        document
            .getElementById(
                "modalEpisodes"
            )
            .innerHTML =
            "";

    }


    document
        .getElementById(
            "detailsModal"
        )
        .classList.add(
            "open"
        );


    document.body.style.overflow =
        "hidden";

}


function renderModalActions(
    item,
    type
) {

    const actions =
        document.getElementById(
            "modalActions"
        );


    if (
        type === "movie"
    ) {

        if (
            item.releaseDate &&
            !isReleased(
                item.releaseDate
            )
        ) {

            actions.innerHTML = `

                <button
                    class="
                        action-button
                        primary
                    "
                    onclick="
                        closeModal()
                    "
                >

                    Releases
                    ${formatReleaseDate(
                        item.releaseDate
                    )}

                </button>

            `;

            return;

        }


        actions.innerHTML = `

            <button
                class="
                    action-button
                    primary
                "
                onclick="
                    toggleMovieWatched()
                "
            >

                ${
                    item.watched
                        ? "Mark Unwatched"
                        : "Mark Watched"
                }

            </button>

        `;

        return;

    }


    const progress =
        getTVProgress(
            item
        );


    actions.innerHTML = `

        <button
            class="
                action-button
                primary
            "
            ${
                progress.nextEpisode
                    ? ""
                    : "disabled"
            }
            onclick="
                markNextEpisode()
            "
        >

            ${
                progress.nextEpisode
                    ? `Mark S${progress.nextEpisode.season} E${progress.nextEpisode.number} Watched`
                    : "All Available Episodes Watched"
            }

        </button>

    `;

}


/* =========================================================
   EPISODES
========================================================= */

function renderEpisodes(
    show
) {

    const container =
        document.getElementById(
            "modalEpisodes"
        );


    const seasons = {};


    show.episodes.forEach(
        episode => {

            if (
                !seasons[
                    episode.season
                ]
            ) {

                seasons[
                    episode.season
                ] = [];

            }


            seasons[
                episode.season
            ].push(
                episode
            );

        }
    );


    const seasonKeys =
        Object.keys(
            seasons
        )
        .map(
            Number
        )
        .sort(
            (a,b) =>
                a - b
        );


    const latestReleasedSeason =
        seasonKeys.find(
            season =>
                seasons[season].some(
                    episode =>
                        isReleased(
                            episode.releaseDate
                        )
                )
        );


    if (
        !selectedSeason ||
        !seasonKeys.includes(
            selectedSeason
        )
    ) {

        selectedSeason =
            latestReleasedSeason ||
            seasonKeys[0];

    }


    container.innerHTML = `

        <div
            style="
                font-size:16px;
                font-weight:750;
            "
        >
            Episodes
        </div>


        <div class="season-selector">

            ${
                seasonKeys.map(
                    season => {

                        const isUpcoming =
                            seasons[
                                season
                            ].every(
                                episode =>
                                    !isReleased(
                                        episode.releaseDate
                                    )
                            );


                        return `

                            <button
                                class="
                                    season-button
                                    ${
                                        season ===
                                        selectedSeason
                                            ? "active"
                                            : ""
                                    }
                                    ${
                                        isUpcoming
                                            ? "upcoming"
                                            : ""
                                    }
                                "
                                onclick="
                                    selectSeason(
                                        '${show.id}',
                                        ${season}
                                    )
                                "
                            >

                                Season ${season}

                            </button>

                        `;

                    }
                ).join("")
            }

        </div>


        <div id="episodeList"></div>

    `;


    renderSeasonEpisodes(
        show,
        selectedSeason
    );

}


function selectSeason(
    showId,
    season
) {

    selectedSeason =
        Number(
            season
        );


    const show =
        getItem(
            "tv",
            showId
        );


    renderEpisodes(
        show
    );

}


function renderSeasonEpisodes(
    show,
    season
) {

    const list =
        document.getElementById(
            "episodeList"
        );


    if (!list) {
        return;
    }


    const episodes =
        show.episodes.filter(
            episode =>
                Number(
                    episode.season
                ) ===
                Number(
                    season
                )
        );


    list.innerHTML =
        episodes
            .map(
                episode => {

                    const upcoming =
                        !isReleased(
                            episode.releaseDate
                        );


                    return `

                        <div class="episode">

                            <button
                                class="
                                    episode-check
                                    ${
                                        episode.watched
                                            ? "watched"
                                            : ""
                                    }
                                "
                                ${
                                    upcoming
                                        ? "disabled"
                                        : ""
                                }
                                onclick="
                                    toggleEpisode(
                                        '${show.id}',
                                        '${episode.id}'
                                    )
                                "
                            >

                                ${
                                    episode.watched
                                        ? `
                                            <svg
                                                class="
                                                    icon
                                                    icon-small
                                                "
                                                viewBox="0 0 24 24"
                                            >
                                                <path
                                                    d="
                                                        M5 12
                                                        l4 4
                                                        10-10
                                                    "
                                                />
                                            </svg>
                                        `
                                        : ""
                                }

                            </button>


                            <div class="episode-info">

                                <div class="episode-title">

                                    ${episode.number}.
                                    ${escapeHTML(
                                        episode.title
                                    )}

                                </div>


                                <div class="episode-meta">

                                    ${
                                        upcoming

                                            ? `
                                                Releases
                                                ${formatDate(
                                                    episode.releaseDate
                                                )}
                                            `

                                            : `
                                                Season
                                                ${episode.season}
                                                ·
                                                ${episode.runtime}
                                            `
                                    }

                                </div>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================================================
   EPISODE ACTIONS
========================================================= */

function toggleEpisode(
    showId,
    episodeId
) {

    const show =
        getItem(
            "tv",
            showId
        );


    const episode =
        show.episodes.find(
            item =>
                item.id ===
                episodeId
        );


    if (
        !isReleased(
            episode.releaseDate
        )
    ) {

        showToast(
            "This episode is not available yet"
        );

        return;

    }


    episode.watched =
        !episode.watched;


    saveState();


    renderEpisodes(
        show
    );


    renderDashboard();


    showToast(
        episode.watched
            ? "Episode marked watched"
            : "Episode marked unwatched"
    );

}


function markNextEpisode() {

    if (!currentItem) {
        return;
    }


    const show =
        getItem(
            "tv",
            currentItem.id
        );


    const progress =
        getTVProgress(
            show
        );


    if (
        !progress.nextEpisode
    ) {

        showToast(
            "All available episodes watched"
        );

        return;

    }


    progress.nextEpisode.watched =
        true;


    saveState();


    renderEpisodes(
        show
    );


    renderModalActions(
        show,
        "tv"
    );


    renderDashboard();


    showToast(
        "Episode marked watched"
    );

}


/* =========================================================
   MOVIE ACTION
========================================================= */

function toggleMovieWatched() {

    if (!currentItem) {
        return;
    }


    const movie =
        getItem(
            "movie",
            currentItem.id
        );


    if (
        !isReleased(
            movie.releaseDate
        )
    ) {

        showToast(
            "This movie has not been released yet"
        );

        return;

    }


    movie.watched =
        !movie.watched;


    saveState();


    renderModalActions(
        movie,
        "movie"
    );


    renderDashboard();


    renderLibrary();


    renderWatched();


    showToast(
        movie.watched
            ? "Movie marked watched"
            : "Movie marked unwatched"
    );

}


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById(
        "librarySearchInput"
    )
    .addEventListener(
        "input",
        function() {

            renderLibrary();

        }
    );


/* =========================================================
   PROFILE
========================================================= */

function renderProfile() {

    const profile =
        state.profiles.find(
            item =>
                item.id ===
                state.activeProfileId
        );


    if (!profile) {
        return;
    }


    document
        .getElementById(
            "profileName"
        )
        .textContent =
        profile.name;


    document
        .getElementById(
            "headerAvatar"
        )
        .textContent =
        profile.initials;


    document
        .getElementById(
            "largeAvatar"
        )
        .textContent =
        profile.initials;

}


/* =========================================================
   EMPTY STATE
========================================================= */

function emptyState(
    title
) {

    return `

        <div
            class="empty-state"
            style="
                grid-column:
                    1 / -1;
            "
        >

            <svg
                class="
                    icon
                    icon-large
                "
                viewBox="0 0 24 24"
            >

                <rect
                    x="3"
                    y="4"
                    width="18"
                    height="16"
                    rx="3"
                />

                <path d="M8 4v16"/>
                <path d="M16 4v16"/>

            </svg>


            <h3>
                ${title}
            </h3>


            <p>
                Your library will appear here.
            </p>

        </div>

    `;

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   MODAL
========================================================= */

function closeModal() {

    document
        .getElementById(
            "detailsModal"
        )
        .classList.remove(
            "open"
        );


    document.body.style.overflow =
        "";

}


function closeModalOutside(
    event
) {

    if (
        event.target.id ===
        "detailsModal"
    ) {

        closeModal();

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ||
        "";


    return div.innerHTML;

}


/* =========================================================
   AUTO REFRESH
========================================================= */

function refreshApp() {

    renderDashboard();

    renderLibrary();

    renderWatched();

    renderUpcoming();

    renderProfile();


    if (
        currentItem
    ) {

        const item =
            getItem(
                currentItem.type,
                currentItem.id
            );


        if (item) {

            renderModalActions(
                item,
                currentItem.type
            );

        }

    }

}


/*
    This checks every 30 seconds.

    This means if the website is left open
    when an episode/movie reaches its release
    time, the UI updates automatically.
*/

setInterval(
    refreshApp,
    30000
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            closeModal();

        }

    }
);


/* =========================================================
   INITIALISE
========================================================= */

loadState();

createDemoData();

renderProfile();

renderDashboard();

setLibraryType(
    "movie"
);

setWatchedType(
    "movie"
);

setUpcomingType(
    "tv"
);

</script>

</html>
