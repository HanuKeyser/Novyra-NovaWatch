<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovaWatch — Premium Tracker</title>
    <!-- Google Fonts SF Pro Display equivalent -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-card-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 320px 0 rgba(31, 38, 135, 0.1);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #0071e3;
            --accent-gradient: linear-gradient(135deg, #0071e3 0%, #42a5f5 100%);
            --danger: #ff3b30;
            --success: #34c759;
            --blur: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Mobile Container Frame */
        #app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            background: rgba(245, 245, 247, 0.75);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media(min-width: 431px) {
            #app-container {
                border-radius: 44px;
                border: 8px solid rgba(255, 255, 255, 0.4);
            }
        }

        /* Views System */
        .view {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 100px 16px;
            display: none;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Liquid Glass Elements */
        .glass-panel {
            background: var(--glass-card-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        /* Header Navigation */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid rgba(255,255,255,0.4);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #1d1d1f 0%, #434345 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-badge {
            font-size: 13px;
            font-weight: 600;
            background: rgba(0,113,227,0.1);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0,113,227,0.2);
            cursor: pointer;
        }

        /* Bottom Liquid Navigation Bar */
        .nav-bar {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            height: 70px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            font-weight: 500;
            flex: 1;
            height: 100%;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 4px;
            transition: transform 0.2s ease;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-item.active i {
            transform: scale(1.15);
        }

        /* Auth Screen */
        #auth-screen {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(245,247,250,0.95), rgba(195,207,226,0.95));
            backdrop-filter: blur(40px);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        .auth-card {
            width: 100%;
            max-width: 360px;
            padding: 30px 24px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
        }

        .auth-card h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-left: 12px;
            margin-bottom: 4px;
            display: block;
        }

        .glass-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 18px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.85);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0,113,227,0.15);
        }

        .glass-btn {
            width: 100%;
            padding: 14px;
            border-radius: 18px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .glass-btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 8px 20px rgba(0,113,227,0.3);
            margin-top: 8px;
        }

        .btn-google {
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-main);
            border: 1px solid rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .auth-switch {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .auth-switch span {
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
        }

        /* Content Cards & Grids */
        .search-bar-container {
            margin-bottom: 16px;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .media-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
            cursor: pointer;
            position: relative;
        }

        .media-card:active {
            transform: scale(0.96);
        }

        .media-poster {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #e1e1e6;
        }

        .media-info {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .media-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .media-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
        }

        .rating-badge {
            background: rgba(255, 204, 0, 0.15);
            color: #b28600;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 700;
        }

        /* Action Buttons on Cards */
        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .action-chip {
            flex: 1;
            padding: 6px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-watch {
            background: rgba(52, 199, 89, 0.15);
            color: #248a3d;
        }

        .btn-unwatch {
            background: rgba(255, 59, 48, 0.12);
            color: #c92a24;
        }

        .btn-remove {
            background: rgba(142, 142, 147, 0.15);
            color: #555558;
        }

        /* Home Hero Section */
        .hero-banner {
            width: 100%;
            height: 240px;
            border-radius: 24px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.75) 100%);
            border-radius: 24px;
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-content h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        /* Modal Details */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-sheet {
            width: 100%;
            max-height: 85vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(40px);
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.15);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .close-modal {
            float: right;
            font-size: 18px;
            background: rgba(0,0,0,0.06);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Hidden Utility */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- Authentication View / Login Screen -->
        <div id="auth-screen">
            <div class="auth-card">
                <div style="font-size: 40px; color: var(--accent); margin-bottom: 12px;">
                    <i class="fa-solid fa-film"></i>
                </div>
                <h2>NovaWatch</h2>
                <p id="auth-subtitle">Your Cinematic Experience</p>

                <div id="username-container" class="input-group hidden">
                    <label>Choose Username</label>
                    <input type="text" id="username-input" class="glass-input" placeholder="e.g. Cinephile99">
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email-input" class="glass-input" placeholder="name@example.com">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password-input" class="glass-input" placeholder="••••••••">
                </div>

                <button id="auth-main-btn" class="glass-btn btn-primary" onclick="handleAuthSubmit()">Sign In</button>
                <button class="glass-btn btn-google" onclick="handleGoogleSignIn()">
                    <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continue with Google
                </button>

                <div class="auth-switch">
                    <span id="auth-toggle-text" onclick="toggleAuthMode()">Don't have an account? Sign Up</span>
                </div>
            </div>
        </div>

        <!-- Top Header -->
        <div class="app-header">
            <h1 id="header-title">Home</h1>
            <div class="user-badge" id="user-display-badge" onclick="logoutUser()">Account</div>
        </div>

        <!-- 1. Home Tab -->
        <div id="tab-home" class="view active">
            <div id="hero-container"></div>
            <div class="section-title">Trending Today</div>
            <div id="home-trending-grid" class="media-grid"></div>
        </div>

        <!-- 2. TV Show Tab -->
        <div id="tab-tv" class="view">
            <div class="section-title">Popular TV Series</div>
            <div id="tv-grid" class="media-grid"></div>
        </div>

        <!-- 3. Movie Tab -->
        <div id="tab-movie" class="view">
            <div class="section-title">Popular Movies</div>
            <div id="movie-grid" class="media-grid"></div>
        </div>

        <!-- 4. Upcoming Tab -->
        <div id="tab-upcoming" class="view">
            <div class="section-title">Upcoming Releases</div>
            <div id="upcoming-grid" class="media-grid"></div>
        </div>

        <!-- 5. Discover Tab -->
        <div id="tab-discover" class="view">
            <div class="search-bar-container">
                <input type="text" id="search-input" class="glass-input" placeholder="Search movies, TV shows..." oninput="handleSearch(this.value)">
            </div>
            <div id="search-results-grid" class="media-grid"></div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('home', this)">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="switchTab('tv', this)">
                <i class="fa-solid fa-tv"></i>
                <span>TV Shows</span>
            </div>
            <div class="nav-item" onclick="switchTab('movie', this)">
                <i class="fa-solid fa-film"></i>
                <span>Movies</span>
            </div>
            <div class="nav-item" onclick="switchTab('upcoming', this)">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Upcoming</span>
            </div>
            <div class="nav-item" onclick="switchTab('discover', this)">
                <i class="fa-solid fa-compass"></i>
                <span>Discover</span>
            </div>
        </div>

        <!-- Details Modal Sheet -->
        <div id="detail-modal" class="modal-overlay" onclick="closeModal(event)">
            <div class="modal-sheet" id="modal-sheet-content">
                <!-- Dynamically populated detail sheet -->
            </div>
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged,
            updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // CONFIGURATION
        // ==========================================
        const TMDB_API_KEY = "YOUR_TMDB_API_KEY_HERE"; // Replace with your TMDB API Key
        const TMDB_BASE_URL = "https://api.themoviedb.org/3";
        const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";

        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        let isSignUpMode = false;
        let currentUserData = null;

        // Auth state persistence listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserData = user;
                document.getElementById('auth-screen').classList.add('hidden');
                
                // Fetch profile/username data
                const userDoc = await getDoc(doc(db, "users", user.uid));
                let username = user.displayName || "User";
                if (userDoc.exists()) {
                    username = userDoc.data().username || username;
                }
                document.getElementById('user-display-badge').innerText = username;
                loadAppData();
            } else {
                currentUserData = null;
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        window.toggleAuthMode = function() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-subtitle');
            const btn = document.getElementById('auth-main-btn');
            const toggle = document.getElementById('auth-toggle-text');
            const usernameBox = document.getElementById('username-container');

            if (isSignUpMode) {
                title.innerText = "Create Your NovaWatch Account";
                btn.innerText = "Sign Up";
                toggle.innerText = "Already have an account? Sign In";
                usernameBox.classList.remove('hidden');
            } else {
                title.innerText = "Your Cinematic Experience";
                btn.innerText = "Sign In";
                toggle.innerText = "Don't have an account? Sign Up";
                usernameBox.classList.add('hidden');
            }
        }

        window.handleAuthSubmit = async function() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            const username = document.getElementById('username-input').value;

            try {
                if (isSignUpMode) {
                    if (!username) {
                        alert("Please enter a username.");
                        return;
                    }
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(res.user, { displayName: username });
                    await setDoc(doc(db, "users", res.user.uid), { username, email, createdAt: new Date() });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                alert(error.message);
            }
        }

        window.handleGoogleSignIn = async function() {
            try {
                const res = await signInWithPopup(auth, googleProvider);
                const userRef = doc(db, "users", res.user.uid);
                const userDoc = await getDoc(userRef);
                if (!userDoc.exists()) {
                    await setDoc(userRef, { 
                        username: res.user.displayName || "Cinephile", 
                        email: res.user.email, 
                        createdAt: new Date() 
                    });
                }
            } catch (error) {
                alert(error.message);
            }
        }

        window.logoutUser = async function() {
            if(confirm("Log out of NovaWatch?")) {
                await signOut(auth);
            }
        }

        // ==========================================
        // TMDB DATA FETCHING
        // ==========================================
        async function fetchTMDB(endpoint) {
            try {
                const response = await fetch(`${TMDB_BASE_URL}${endpoint}?api_key=${TMDB_API_KEY}&language=en-US`);
                const data = await response.json();
                return data.results || [];
            } catch (err) {
                console.error("TMDB Fetch Error:", err);
                return [];
            }
        }

        async function loadAppData() {
            // Home Feed
            const trending = await fetchTMDB("/trending/all/day");
            if(trending.length > 0) {
                renderHero(trending[0]);
                renderMediaGrid(trending.slice(1, 11), 'home-trending-grid');
            }

            // TV Shows Tab
            const tvShows = await fetchTMDB("/tv/popular");
            renderMediaGrid(tvShows, 'tv-grid', 'tv');

            // Movies Tab
            const movies = await fetchTMDB("/movie/popular");
            renderMediaGrid(movies, 'movie-grid', 'movie');

            // Upcoming Tab
            const upcoming = await fetchTMDB("/movie/upcoming");
            renderMediaGrid(upcoming, 'upcoming-grid', 'movie');
        }

        function renderHero(item) {
            const container = document.getElementById('hero-container');
            const title = item.title || item.name;
            const poster = `${IMAGE_BASE_URL}${item.backdrop_path || item.poster_path}`;
            const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';

            container.innerHTML = `
                <div class="hero-banner" style="background-image: url('${poster}')" onclick='openDetailModal(${JSON.stringify(item)})'>
                    <div class="hero-content">
                        <h3>${title}</h3>
                        <div class="media-meta" style="color: rgba(255,255,255,0.8);">
                            <span>⭐ ${rating} • Featured Release</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMediaGrid(items, elementId, defaultMediaType = 'movie') {
            const grid = document.getElementById(elementId);
            grid.innerHTML = items.map(item => {
                const title = item.title || item.name;
                const poster = item.poster_path ? `${IMAGE_BASE_URL}${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Preview';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const mediaType = item.media_type || defaultMediaType;

                return `
                    <div class="media-card" onclick='openDetailModal(${JSON.stringify(item)}, "${mediaType}")'>
                        <img src="${poster}" class="media-poster" alt="${title}" loading="lazy">
                        <div class="media-info">
                            <div>
                                <div class="media-title">${title}</div>
                                <div class="media-meta">
                                    <span>${(item.release_date || item.first_air_date || '').substring(0,4)}</span>
                                    <span class="rating-badge">⭐ ${rating}</span>
                                </div>
                            </div>
                            <div class="card-actions" onclick="event.stopPropagation()">
                                <button class="action-chip btn-watch" onclick='updateWatchState(${item.id}, "watch")'>Watch</button>
                                <button class="action-chip btn-unwatch" onclick='updateWatchState(${item.id}, "unwatch")'>Unwatch</button>
                                <button class="action-chip btn-remove" onclick='updateWatchState(${item.id}, "remove")'>Remove</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // NAVIGATION TABS & SEARCH
        // ==========================================
        window.switchTab = function(tabName, element) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            element.classList.add('active');

            const titles = {
                'home': 'Home',
                'tv': 'TV Series',
                'movie': 'Movies',
                'upcoming': 'Upcoming',
                'discover': 'Discover & Search'
            };
            document.getElementById('header-title').innerText = titles[tabName];
        }

        let searchTimeout;
        window.handleSearch = function(query) {
            clearTimeout(searchTimeout);
            if(!query.trim()) {
                document.getElementById('search-results-grid').innerHTML = '';
                return;
            }
            searchTimeout = setTimeout(async () => {
                const results = await fetchTMDB(`/search/multi?query=${encodeURIComponent(query)}`);
                renderMediaGrid(results.filter(i => i.media_type === 'movie' || i.media_type === 'tv'), 'search-results-grid');
            }, 400);
        }

        // ==========================================
        // DETAILS MODAL & TRACKING ACTIONS
        // ==========================================
        window.openDetailModal = function(item, mediaType = 'movie') {
            const modal = document.getElementById('detail-modal');
            const sheet = document.getElementById('modal-sheet-content');
            const title = item.title || item.name;
            const poster = item.poster_path ? `${IMAGE_BASE_URL}${item.poster_path}` : '';

            sheet.innerHTML = `
                <button class="close-modal" onclick="closeModalBtn()"><i class="fa-solid fa-xmark"></i></button>
                <div style="display: flex; gap: 16px; margin-bottom: 16px; align-items: center;">
                    <img src="${poster}" style="width: 100px; height: 145px; border-radius: 14px; object-fit: cover;">
                    <div>
                        <h2 style="font-size: 18px; margin-bottom: 6px;">${title}</h2>
                        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Release: ${item.release_date || item.first_air_date || 'Unknown'}</p>
                        <span class="rating-badge">Rating: ⭐ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}</span>
                    </div>
                </div>
                <p style="font-size: 13px; line-height: 1.5; color: var(--text-main); margin-bottom: 20px;">${item.overview || 'No synopsis available.'}</p>
                <div style="display: flex; gap: 10px;">
                    <button class="glass-btn btn-primary" onclick='updateWatchState(${item.id}, "watch"); closeModalBtn();'>Mark as Watch</button>
                </div>
            `;
            modal.style.display = 'flex';
        }

        window.closeModal = function(e) {
            if(e.target.id === 'detail-modal') {
                document.getElementById('detail-modal').style.display = 'none';
            }
        }

        window.closeModalBtn = function() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        window.updateWatchState = function(id, action) {
            // Local state feedback handler conforming to UI requirements ('Watch', 'Unwatch', 'Remove')
            const labels = {
                'watch': 'Added to Watch list!',
                'unwatch': 'Marked as Unwatched.',
                'remove': 'Removed from tracker.'
            };
            // Toast feedback popup effect
            const toast = document.createElement('div');
            toast.innerText = labels[action] || 'Updated tracker state';
            toast.style.cssText = `
                position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
                background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
                border-radius: 20px; font-size: 12px; z-index: 4000; backdrop-filter: blur(10px);
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    </script>
</body>
</html>
