<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your quote | Novyra Marketing</title><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.ico"><meta name="theme-color" content="#07080e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap">
<style>
:root{--ink:#f4f6fb;--card:#fff;--line:#d5dcea;--line2:#c0c9df;--text:#0b0f1e;--muted:#535c78;--dim:#6b7390;--spark:#4a86f7;--soft:#2a5fd6;--good:#15803d;--warn:#b45309;--bad:#c0261b;--night:#07080e;
  --display:'Syne','Hanken Grotesk',system-ui,sans-serif;--body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--ease:cubic-bezier(.22,.7,.2,1);color-scheme:light}
*{box-sizing:border-box}html{overflow-x:clip}
body{margin:0;font:400 15px/1.55 var(--body);color:var(--text);background:radial-gradient(900px 420px at 100% 0,rgba(74,134,247,.10),transparent 70%) no-repeat,var(--ink)}
button,input,textarea{font:inherit;color:inherit}
.top{background:var(--night);border-bottom:3px solid var(--spark)}
.top .in{max-width:1240px;margin:0 auto;height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.top img{height:30px;width:auto;display:block}
.top span{color:#93c5fd;font:700 11px var(--body);letter-spacing:.16em;text-transform:uppercase}
.wrap{max-width:1240px;margin:0 auto;padding:28px max(20px,env(safe-area-inset-right,0px)) 60px max(20px,env(safe-area-inset-left,0px))}
.grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:20px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px}
.eyebrow{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
h1{margin:0;font:800 30px/1.1 var(--display);letter-spacing:-.01em}
.for{color:var(--muted);margin:-6px 0 0}
.pill{justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font:700 12px var(--body);background:#eef2fb;color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--good);background:#effaf3}.pill.warn{color:var(--warn);background:#fffbeb}.pill.bad{color:var(--bad);background:#fef3f2}
.kv{display:grid;gap:0;border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv div span{color:var(--muted)} .kv div b{text-align:right;white-space:nowrap}
.kv .big{padding:14px 16px;margin:10px 0 2px;border:0;border-radius:12px;background:var(--spark);color:#fff}
.kv .big span{color:#dbe4ff}.kv .big b{font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;background:#fff;color:var(--text);box-shadow:inset 0 0 0 1px var(--line2);text-decoration:none;transition:background-color .15s,box-shadow .15s,transform .1s}
.btn:hover{box-shadow:inset 0 0 0 1px var(--spark)}.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#2a4fb0,var(--spark));color:#fff;box-shadow:0 10px 24px rgba(74,134,247,.28)}
.btn[disabled]{opacity:.55;cursor:default}
.acts{display:grid;gap:10px}
.acts .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:6px}.field span{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid var(--line2);border-radius:11px;padding:11px 13px;background:#fff;outline:0;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field textarea:focus{border-color:var(--spark);box-shadow:0 0 0 4px rgba(74,134,247,.14)}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}.agree input{margin-top:3px;accent-color:var(--spark);width:17px;height:17px}
.panel{display:none;gap:12px}.panel.on{display:grid;animation:in .24s var(--ease)}
.note{font-size:13px;color:var(--muted);margin:0}
.done{text-align:center;justify-items:center}
.done .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#e9f7ef;color:var(--good);font:800 26px var(--body)}
.done.warn .ic{background:#fff7e6;color:var(--warn)}
.contact{font-size:14px;color:var(--muted)}.contact b{color:var(--text)}.contact a{color:var(--soft);text-decoration:none}
.pages{display:grid;gap:22px;justify-items:center}
.holder{overflow:hidden;border-radius:6px;box-shadow:0 18px 40px rgba(16,24,48,.14);background:#fff}
.holder .sc{transform-origin:0 0;width:794px}
.msg{max-width:560px;margin:60px auto;text-align:center;display:grid;gap:12px;justify-items:center}
.msg h1{font-size:26px}.msg p{color:var(--muted);margin:0}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--spark);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#render{position:fixed;left:-20000px;top:0}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}.side{position:static}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* quote paper, same as the app */
.paper{width:794px;height:1123px;background:#fff;color:#1f2433;font:400 11px/1.45 var(--body);position:relative;overflow:hidden;display:flex;flex-direction:column}
.paper-holder{position:relative;margin:0 auto}
.paper-scale{transform-origin:top left;position:absolute;top:0;left:0}
.paper{width:794px;height:1123px;background:#fff;color:#1f2433;font:400 11px/1.45 var(--body);position:relative;overflow:hidden;display:flex;flex-direction:column}
.paper .band{background:#07080e;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:4px solid #4a86f7}
.paper .band img{height:42px}
.paper .band .t{text-align:right;color:#fff}
.paper .band .t h2{font:800 30px/1 var(--display);color:#fff}
.paper .band .t small{display:block;margin-top:6px;font:700 10px var(--body);letter-spacing:.14em;color:#93c5fd;text-transform:uppercase}
.paper .body{padding:22px 34px 0;flex:1;display:flex;flex-direction:column}
.paper .parties p.by{margin-top:6px;color:#6e768c;font-size:10.5px}
.paper .parties p.by b{color:#07080e}
.paper .facts{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1.2fr;gap:10px;padding-bottom:14px;border-bottom:1px solid #dce0ea}
.paper .facts .l{font:700 8.5px var(--body);letter-spacing:.12em;color:#6e768c;text-transform:uppercase}
.paper .facts .v{font:700 14px var(--body);margin-top:4px;color:#07080e}
.paper .facts .total{text-align:right}
.paper .facts .total .v{color:#4a86f7;font-size:18px}
.paper .parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:16px 0 14px}
.paper .parties .l{font:700 8.5px var(--body);letter-spacing:.12em;color:#4a86f7;text-transform:uppercase;margin-bottom:4px}
.paper .parties p{margin:0;color:#3a4156;font-size:11.5px}
.paper .parties p.n{font-weight:700;color:#07080e}
.paper .ref{font:700 10px var(--body);color:#4a86f7;margin:-4px 0 8px}
.paper table{width:100%;border-collapse:collapse}
.paper thead th{background:#07080e;color:#fff;font:700 9.5px var(--body);text-align:left;padding:8px 10px}
.paper thead th.r,.paper td.r{text-align:right}
.paper tbody td{padding:8px 10px;border-bottom:1px solid #e6e9f1;font-size:11px;vertical-align:top}
.paper tbody tr:nth-child(even) td{background:#f6f8fc}
.paper tbody td.i{color:#6e768c;width:22px}
.paper tbody td b{color:#07080e}
.paper .lower{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px}
.paper .pay{background:#eef4ff;border-radius:6px;padding:12px 14px}
.paper .pay .l{font:700 8.5px var(--body);letter-spacing:.12em;color:#4a86f7;text-transform:uppercase;margin-bottom:6px}
.paper .pay dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.paper .pay dt{color:#6e768c}
.paper .pay dd{margin:0;font-weight:700;color:#07080e}
.paper .pay small{display:block;margin-top:8px;color:#6e768c}
.paper .tot div{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid #e6e9f1;color:#6e768c}
.paper .tot div span:last-child{color:#1f2433}
.paper .tot .big{background:#4a86f7;color:#fff;border:0;font:700 13px var(--body);padding:9px 10px}
.paper .tot .big span:last-child{color:#fff}
.paper .tot .soft{background:#eef4ff;border:0;font-weight:700;color:#1f2433}
.paper .terms{margin-top:18px}
.paper .terms .l{font:700 8.5px var(--body);letter-spacing:.12em;color:#4a86f7;text-transform:uppercase;margin-bottom:4px}
.paper .terms p{margin:0 0 2px;color:#3a4156;font-size:10px}
.paper .sign{margin-top:16px;display:grid;grid-template-columns:1.4fr 1fr;gap:30px}
.paper .sign .l{font:700 8.5px var(--body);letter-spacing:.12em;color:#4a86f7;text-transform:uppercase;grid-column:1/-1}
.paper .sign div{border-bottom:1px solid #9aa3ba;height:30px}
.paper .sign small{color:#6e768c;font-size:9px}
.paper .stamp{position:absolute;top:118px;right:34px;transform:rotate(-8deg);border:3px solid currentColor;border-radius:8px;padding:4px 12px;font:800 20px var(--display);letter-spacing:.06em;opacity:.85}
.paper .stamp.accepted,.paper .stamp.paid{color:#15803d} .paper .stamp.declined,.paper .stamp.cancelled{color:#6e768c} .paper .stamp.expired{color:#b91c1c}
.paper .foot{margin-top:auto;background:#07080e;color:#fff;text-align:center;font:700 10px var(--body);padding:12px;letter-spacing:.02em}
.paper .spacer{flex:1}
.paper-holder{box-shadow:0 12px 30px rgba(16,24,48,.16)}
.paper.measure{height:auto;overflow:visible}
.paper .blk{display:flow-root}
.paper .cont{text-align:right;font:700 9.5px var(--body);color:#6e768c;padding-top:6px;letter-spacing:.04em}
.paper .foot{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding:12px 34px;text-align:left}
.paper .foot .pg{text-align:right}
.paper .foot .tag{color:#93c5fd}
.paper .per{display:block;font-size:8.5px;color:#6e768c}
.paper .parties .wa{color:#6e768c;font-size:10px}
.paper .foot .pg{color:#93c5fd}
.paper .parties p.who{margin-top:4px}
.paper .parties p.addr{margin-top:4px}
.paper .draftmark{font:700 8px var(--body);letter-spacing:.1em;text-transform:uppercase;color:#b45309;vertical-align:2px}
.paper .body{padding:26px 34px 22px}
.paper .facts{padding-bottom:16px}
.paper .parties{padding:18px 0 18px}
.paper .lower{margin-top:26px}
.paper .terms{margin-top:22px;padding-top:16px;border-top:1px solid #e6e9f1}
.paper .terms.notes{border-top:0;padding-top:0}
.paper .terms p{margin:0 0 4px;line-height:1.5}
.paper .ref{margin:0 0 10px}
.paper tbody td{padding:9px 10px}
</style></head><body>

  let q = null;
  ref.get().then(s => { if (!s.exists) return fail('This quote link is no longer active', 'It may have been replaced or turned off. Ask Novyra Marketing for the latest link.'); q = s.data(); draw(); })
    .catch(() => fail('This quote link is no longer active', 'It may have been replaced or turned off. Ask Novyra Marketing for the latest link.'));
  function status() { if (q.status === 'Open' && q.validUntil && today() > q.validUntil) return 'Expired'; return q.status; }
  function draw(after) {
    const st = status(), r = q.response || {}, f = q.from || {};
    const pill = { Open: ['Waiting for your answer', ''], Accepted: ['Accepted', 'ok'], 'Changes requested': ['Changes requested', 'warn'], Expired: ['Expired', 'bad'], Declined: ['Declined', 'bad'], Draft: ['Being prepared', ''] }[st] || [st, ''];
    const state = after === 'Accepted' || (st === 'Accepted' && r.name) ? `<div class="card done"><div class="ic">✓</div><h1 style="font-size:22px">${after ? 'Thank you, ' + esc((r.name || '').split(' ')[0]) + '!' : 'Quote accepted'}</h1><p class="note">${esc(r.name || '')} accepted this quote${r.at ? ' on ' + fmtWhen(r.at) : ''}. ${f.name ? esc(f.name.split(' ')[0]) : 'Novyra Marketing'} will be in touch about the next steps.${q.dueNow ? ` To start, ${money(q.dueNow)} is due now; the payment details are on the quote.` : ''}</p></div>`
      : after === 'Changes requested' || st === 'Changes requested' ? `<div class="card done warn"><div class="ic">✎</div><h1 style="font-size:22px">Changes requested</h1><p class="note">Your message was sent${r.at ? ' on ' + fmtWhen(r.at) : ''}. You’ll get an updated quote at this same link.</p></div>`
      : st === 'Expired' ? `<div class="card"><b>This quote has expired</b><p class="note">It was valid until ${fmtDate(q.validUntil)}. Ask ${esc(f.name || 'Novyra Marketing')} for an updated quote at today’s prices.</p></div>`
      : st === 'Open' ? `<div class="card acts" id="acts"><button class="btn primary" data-open="accept">Accept quote</button><div class="row"><button class="btn" data-open="changes">Request changes</button><button class="btn" data-pdf>Download PDF</button></div>
          <div class="panel" id="p-accept"><label class="field"><span>Your full name</span><input id="a-name" autocomplete="name" placeholder="Name and surname"></label>
            <label class="agree"><input type="checkbox" id="a-ok"><span>I accept quote ${esc(q.ref)} for ${esc(q.business)}, including the terms on the quote.</span></label>
            <label class="field"><span>Anything to add? (optional)</span><textarea id="a-note" rows="2" placeholder="For example: preferred start date"></textarea></label>
            <button class="btn primary" data-send="Accepted">Confirm acceptance</button><p class="note">Your name, the date and time are recorded as your acceptance.</p></div>
          <div class="panel" id="p-changes"><label class="field"><span>Your name</span><input id="c-name" autocomplete="name"></label>
            <label class="field"><span>What would you like changed?</span><textarea id="c-note" rows="4" placeholder="For example: add 2 extra posts a month"></textarea></label>
            <button class="btn primary" data-send="Changes requested">Send request</button></div></div>`
      : '';
    app.innerHTML = `<div class="grid"><aside class="side">
        <div class="card"><span class="eyebrow">Quote from Novyra Marketing</span><h1>${esc(q.ref)}</h1><p class="for">For ${esc(q.business)}</p><span class="pill ${pill[1]}">${pill[0]}</span>
          <div class="kv"><div><span>Quote total</span><b>${money(q.total)}</b></div>${q.dueNow ? `<div class="big"><span>${esc(q.dueLabel || 'Due now')}</span><b>${money(q.dueNow)}</b></div>` : ''}
            ${q.balance > 0 ? `<div><span>Balance on approval</span><b>${money(q.balance)}</b></div>` : ''}${q.monthly ? `<div><span>Then each month, in advance</span><b>${money(q.monthly)}</b></div>` : ''}
            <div><span>Valid until</span><b>${fmtDate(q.validUntil)}</b></div></div></div>
        ${state}
        ${st !== 'Open' ? '<button class="btn" data-pdf>Download PDF</button>' : ''}
        <div class="card contact"><span class="eyebrow">Questions?</span><div><b>${esc(f.name || 'Novyra Marketing')}</b>${f.title ? ' · ' + esc(f.title) : ''}</div>
          ${f.email ? `<a href="mailto:${esc(f.email)}">${esc(f.email)}</a>` : ''}${f.phone ? `<div>${esc(f.phone)} <span class="note" style="display:inline">(WhatsApp messages only)</span></div>` : ''}</div>
      </aside><section class="pages" id="pages"></section></div>`;
    const pages = $('#pages'); const tmp = document.createElement('div'); tmp.innerHTML = q.pages || '';
    [...tmp.querySelectorAll('.paper')].forEach(p => { const h = document.createElement('div'); h.className = 'holder'; const sc = document.createElement('div'); sc.className = 'sc'; sc.appendChild(p); h.appendChild(sc); pages.appendChild(h); });
    fit(); bind();
  }
  function fit() { const w = $('#pages') && $('#pages').clientWidth; if (!w) return; const s = Math.min(1, w / 794); document.querySelectorAll('.holder').forEach(h => { h.style.width = 794 * s + 'px'; h.style.height = 1123 * s + 'px'; h.firstChild.style.transform = `scale(${s})`; }); }
  addEventListener('resize', () => requestAnimationFrame(fit));
  function bind() {
    document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { const id = 'p-' + b.dataset.open; document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === id && !p.classList.contains('on'))); const f = document.querySelector('#' + id + '.on input'); if (f) f.focus(); }));
    document.querySelectorAll('[data-pdf]').forEach(b => b.addEventListener('click', () => pdf(b)));
    document.querySelectorAll('[data-send]').forEach(b => b.addEventListener('click', async () => {
      const acc = b.dataset.send === 'Accepted', name = (acc ? $('#a-name') : $('#c-name')).value.trim(), note = (acc ? $('#a-note') : $('#c-note')).value.trim();
      if (name.length < 2) { (acc ? $('#a-name') : $('#c-name')).focus(); return flash(b, 'Please type your name'); }
      if (acc && !$('#a-ok').checked) return flash(b, 'Please tick the box to accept');
      if (!acc && !note) { $('#c-note').focus(); return flash(b, 'Say what you’d like changed'); }
      b.disabled = true; b.textContent = 'Sending…';
      const response = { name: name.slice(0, 99), note: note.slice(0, 1999), at: new Date().toISOString(), rev: q.rev || 1 };
      try { await ref.update({ status: b.dataset.send, response }); q.status = b.dataset.send; q.response = response; draw(b.dataset.send); scrollTo({ top: 0, behavior: 'smooth' }); }
      catch (e) { b.disabled = false; b.textContent = acc ? 'Confirm acceptance' : 'Send request'; flash(b, 'That didn’t go through. The quote may have changed or expired; reload the page.'); }
    }));
  }
  function flash(b, t) { let n = b.parentElement.querySelector('.flash'); if (!n) { n = document.createElement('p'); n.className = 'note flash'; n.style.color = 'var(--bad)'; b.after(n); } n.textContent = t; }
  async function pdf(b) {
    if (!window.html2canvas || !window.jspdf) return flash(b, 'The PDF tools didn’t load. Reload the page and try again.');
    const label = b.textContent; b.disabled = true; b.textContent = 'Preparing PDF…';
    try { await document.fonts.ready; const host = $('#render'); host.innerHTML = q.pages;
      await Promise.all([...host.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
      const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' }), papers = host.querySelectorAll('.paper');
      for (let i = 0; i < papers.length; i++) { const c = await html2canvas(papers[i], { scale: 2, backgroundColor: '#ffffff', logging: false }); if (i) doc.addPage(); doc.addImage(c.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 595.28, 841.89); }
      host.innerHTML = ''; doc.save(q.pdfName || 'Novyra Quote.pdf');
    } catch (e) { flash(b, 'The PDF couldn’t be made. Try again.'); }
    b.disabled = false; b.textContent = label;
  }
})();
</script></body></html>
