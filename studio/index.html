<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><link rel="icon" href="/favicon.ico"><meta name="theme-color" content="#07080e"><title>Novyra Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>*,*::before,*::after{box-sizing:border-box}html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><style>
/* Layout: a dark Novyra studio desk — top bar, a summary strip, then lists; the editor puts the form beside a live A4 preview. */
:root{
  --ink:#07080e; --ink2:#0e1120; --ink3:#161a2e; --line:#232842; --line2:#2f3866;
  --text:#eef1fa; --muted:#9aa3bd; --dim:#7c86a3; --spark:#4a86f7; --soft:#93c5fd;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --display:'Syne','Hanken Grotesk',system-ui,sans-serif; --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text)}
body{font:400 14px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--soft);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
.label{font:700 11px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
header.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:18px 14px;border-bottom:1px solid var(--line)}
header.top img{height:30px;width:auto;display:block}
header.top .app{font:700 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding-left:14px;border-left:1px solid var(--line2)}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs a{padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600}
nav.tabs a[aria-current="page"]{background:var(--ink3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
nav.tabs a:hover{color:var(--text)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--ink3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap}
.btn:hover{box-shadow:inset 0 0 0 1px var(--spark)}
a.btn{text-decoration:none}
.btn.primary{background:linear-gradient(135deg,#2a4fb0,var(--spark));box-shadow:none;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.small{padding:7px 11px;border-radius:10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-block:22px}
.stat{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.stat b{display:block;font:800 22px/1.2 var(--display);margin-top:6px}
.stat b.spark{color:var(--soft)} .stat b.warn{color:var(--warn)} .stat b.bad{color:var(--bad)}
@media (max-width:900px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip .stat:last-child{grid-column:1/-1}}

.head{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-block:6px 14px}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:0;border-radius:999px;padding:6px 12px;background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;font-weight:600;font-size:13px}
.chipbtn[aria-pressed="true"]{background:var(--ink3);color:var(--text);box-shadow:inset 0 0 0 1px var(--spark)}

/* lists */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--ink2)}
table.list{width:100%;border-collapse:collapse;min-width:720px}
table.list th{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
table.list td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover td{background:var(--ink3)}
table.list .r{text-align:right}
.client{font-weight:700}
.sub{color:var(--dim);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:700 12px var(--body);background:var(--ink3);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.draft{color:var(--muted)} .pill.open{color:var(--soft)} .pill.accepted,.pill.paid{color:var(--good)}
.pill.declined,.pill.cancelled{color:var(--dim)} .pill.expired,.pill.overdue{color:var(--bad)} .pill.unpaid,.pill.partpaid,.pill.sent{color:var(--warn)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px}
.notice{border:1px solid var(--line2);background:var(--ink2);border-radius:14px;padding:14px 16px;color:var(--muted);margin-block:14px}
.notice.warn{border-color:#6b5517;color:#fde7a8}
.notice.bad{border-color:#6b2a2a;color:#fecaca}
.notice.good{border-color:#1f5e47;color:#bbf7d0}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:22px;margin-top:20px;align-items:start}
@media (max-width:1080px){.editor{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.panel + .panel{margin-top:14px}
.panel h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field span{font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
textarea{resize:vertical;min-height:64px}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--ink)}
.item + .item{margin-top:10px}
.item .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.item .row3{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}
@media (max-width:420px){.item .row3{grid-template-columns:1fr 1fr}}
.stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--ink)}
.stepper button{border:0;background:var(--ink3);width:34px;height:38px;cursor:pointer;font-size:18px;font-weight:700}
.stepper button:hover{background:var(--line2)}
.stepper input{border:0;border-radius:0;width:52px;text-align:center;padding:8px 4px}
.amount{font-weight:700;text-align:right;color:var(--soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.sticky-actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--ink) 30%);padding-top:18px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));margin-top:12px}
.confirm{border:1px solid var(--spark);background:#0f1a3a;border-radius:14px;padding:14px;margin-top:12px;display:grid;gap:10px}
.confirm p{margin:0}
.timeline{display:grid;gap:0;margin:0;padding:0;list-style:none}
.timeline > li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.timeline > li:first-child{border-top:0}
.timeline .dot{width:26px;height:26px;border-radius:50%;background:var(--ink3);box-shadow:inset 0 0 0 1px var(--line2);display:grid;place-items:center;font:700 10px var(--body);color:var(--soft)}
.timeline ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.timeline .when{color:var(--dim);font-size:12px}

/* preview */
.preview{position:sticky;top:12px}
.preview-frame{background:#1b2040;border-radius:18px;padding:18px;overflow:hidden}
.paper-holder{position:relative;margin:0 auto}
.paper-scale{transform-origin:top left;position:absolute;top:0;left:0}

/* ===== the A4 document (always paper colours) ===== */
.paper{width:794px;height:1123px;background:#fff;color:#1f2433;font:400 11px/1.45 var(--body);position:relative;overflow:hidden;display:flex;flex-direction:column}
.paper .band{background:#07080e;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:4px solid #4a86f7}
.paper .band img{height:42px}
.paper .band .t{text-align:right;color:#fff}
.paper .band .t h2{font:800 30px/1 var(--display);color:#fff}
.paper .band .t small{display:block;margin-top:6px;font:700 10px var(--body);letter-spacing:.14em;color:#93c5fd;text-transform:uppercase}
.paper .body{padding:22px 34px 0;flex:1;display:flex;flex-direction:column}
.paper .parties p.by{margin-top:6px;color:#6e768c;font-size:10.5px}
.paper .parties p.by b{color:#07080e}
.paper .facts{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1.2fr;gap:10px;padding-bottom:14px;border-bottom:1px solid #dce0ea}
.paper .facts .l{font:700 8.5px var(--body);letter-spacing:.12em;color:#6e768c;text-transform:uppercase}
.paper .facts .v{font:700 14px var(--body);margin-top:4px;color:#07080e}
.paper .facts .total{text-align:right}
.paper .facts .total .v{color:#4a86f7;font-size:18px}
.paper .parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:16px 0 14px}
.paper .parties .l{font:700 8.5px var(--body);letter-spacing:.12em;color:#4a86f7;text-transform:uppercase;margin-bottom:4px}
.paper .parties p{margin:0;color:#3a4156;font-size:11.5px}
.paper .parties p.n{font-weight:700;color:#07080e}
.paper .ref{font:700 10px var(--body);color:#4a86f7;margin:-4px 0 8px}
.paper table{width:100%;border-collapse:collapse}
.paper thead th{background:#07080e;color:#fff;font:700 9.5px var(--body);text-align:left;padding:8px 10px}
.paper thead th.r,.paper td.r{text-align:right}
.paper tbody td{padding:8px 10px;border-bottom:1px solid #e6e9f1;font-size:11px;vertical-align:top}
.paper tbody tr:nth-child(even) td{background:#f6f8fc}
.paper tbody td.i{color:#6e768c;width:22px}
.paper tbody td b{color:#07080e}
.paper .lower{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px}
.paper .pay{background:#eef4ff;border-radius:6px;padding:12px 14px}
.paper .pay .l{font:700 8.5px var(--body);letter-spacing:.12em;color:#4a86f7;text-transform:uppercase;margin-bottom:6px}
.paper .pay dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.paper .pay dt{color:#6e768c}
.paper .pay dd{margin:0;font-weight:700;color:#07080e}
.paper .pay small{display:block;margin-top:8px;color:#6e768c}
.paper .tot div{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid #e6e9f1;color:#6e768c}
.paper .tot div span:last-child{color:#1f2433}
.paper .tot .big{background:#4a86f7;color:#fff;border:0;font:700 13px var(--body);padding:9px 10px}
.paper .tot .big span:last-child{color:#fff}
.paper .tot .soft{background:#eef4ff;border:0;font-weight:700;color:#1f2433}
.paper .terms{margin-top:18px}
.paper .terms .l{font:700 8.5px var(--body);letter-spacing:.12em;color:#4a86f7;text-transform:uppercase;margin-bottom:4px}
.paper .terms p{margin:0 0 2px;color:#3a4156;font-size:10px}
.paper .sign{margin-top:16px;display:grid;grid-template-columns:1.4fr 1fr;gap:30px}
.paper .sign .l{font:700 8.5px var(--body);letter-spacing:.12em;color:#4a86f7;text-transform:uppercase;grid-column:1/-1}
.paper .sign div{border-bottom:1px solid #9aa3ba;height:30px}
.paper .sign small{color:#6e768c;font-size:9px}
.paper .stamp{position:absolute;top:118px;right:34px;transform:rotate(-8deg);border:3px solid currentColor;border-radius:8px;padding:4px 12px;font:800 20px var(--display);letter-spacing:.06em;opacity:.85}
.paper .stamp.accepted,.paper .stamp.paid{color:#15803d} .paper .stamp.declined,.paper .stamp.cancelled{color:#6e768c} .paper .stamp.expired{color:#b91c1c}
.paper .foot{margin-top:auto;background:#07080e;color:#fff;text-align:center;font:700 10px var(--body);padding:12px;letter-spacing:.02em}
.paper .spacer{flex:1}

/* owner badge, search, age */
.owner{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#1f3a85,var(--spark));color:#fff;font:700 10.5px var(--body);letter-spacing:.04em}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.search{position:relative;flex:0 1 280px;min-width:0}
.search input{padding-left:34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.age{color:var(--muted)} .age.old{color:var(--warn)} .age.done{color:var(--dim)}
.revtag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:var(--ink3);color:var(--soft);font:700 10.5px var(--body);box-shadow:inset 0 0 0 1px var(--line2);vertical-align:1px}

/* customer picker */
.combo{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.combo-list{position:absolute;left:0;right:50px;top:calc(100% + 6px);z-index:20;margin:0;padding:6px;list-style:none;background:var(--ink2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.45);max-height:300px;overflow:auto}
.combo-list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.combo-list li[aria-selected="true"],.combo-list li:hover{background:var(--ink3)}
.combo-list li .av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);font:700 11px var(--body);color:var(--soft)}
.combo-list li b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-list li.add .av{background:var(--spark);color:#fff;box-shadow:none;font-size:16px}
.combo-list li.none{display:block;color:var(--dim);cursor:default}
.combo-list li.none:hover{background:none}
.btn.icon{width:42px;padding:0;font-size:20px;line-height:1}
.ccard{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--ink);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.ccard .av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--ink3);box-shadow:inset 0 0 0 1px var(--line2);font:800 13px var(--display);color:var(--soft)}
.ccard p{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.ccard p.n{color:var(--text);font-weight:700;font-size:14px}

/* dialogs */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(3,4,10,.72);backdrop-filter:blur(3px);display:grid;place-items:start center;overflow-y:auto;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.dialog{width:min(620px,100%);background:var(--ink2);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.dialog.wide{width:min(760px,100%)}
.dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--ink3),var(--ink2));border-top:3px solid var(--spark)}
.dialog header h3{font-size:18px}
.dialog .x{border:0;background:transparent;color:var(--muted);font-size:22px;width:36px;height:36px;border-radius:10px;cursor:pointer}
.dialog .x:hover{background:var(--ink3);color:var(--text)}
.dialog .content{padding:18px 20px;display:grid;gap:14px}
.dialog footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--ink)}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:12px;background:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button{border:0;border-radius:9px;padding:8px 18px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink3);color:var(--text);box-shadow:inset 0 0 0 1px var(--spark)}
.formrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.formrow > span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
@media (max-width:520px){.formrow{grid-template-columns:1fr;gap:6px}}
.ro{padding:9px 11px;border-radius:10px;background:var(--ink);box-shadow:inset 0 0 0 1px var(--line);color:var(--soft);font-weight:700}
.step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--ink)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink3);color:var(--soft);font:700 12px var(--body);box-shadow:inset 0 0 0 1px var(--line2)}
.step.done .n{background:var(--good);color:#04130c;box-shadow:none}
.step p{margin:0} .step .sub{display:block}
.copyfield{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.doclist{display:grid;gap:6px}
.doclist a{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--ink);border:1px solid var(--line);color:var(--text);text-decoration:none}
.doclist a:hover{border-color:var(--spark)}


/* ===== v4 additions ===== */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.table-wrap{margin-top:12px}
table.list tbody tr:focus-visible td{background:var(--ink3)}
table.list.plain tbody tr{cursor:default} table.list.plain tbody tr:hover td{background:none}
table.list .who{display:flex;gap:12px;align-items:center}
table.list .who .av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--ink3);box-shadow:inset 0 0 0 1px var(--line2);font:700 11px var(--body);color:var(--soft);flex:none}
.btn svg{flex:none}
.btn.danger-solid{background:#b42318;color:#fff;box-shadow:none}
.btn.danger-solid:hover{filter:brightness(1.1)}
a.btn{text-decoration:none}

/* editor head */
.ed-head{margin-top:22px}
.ed-head .back{color:var(--soft);text-decoration:none;font-weight:600;font-size:13px}
.ed-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.ed-title h2{font-size:30px}
.unsaved{font:700 12px var(--body);color:var(--warn);display:inline-flex;align-items:center;gap:6px}
.unsaved::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
dl.meta{display:flex;flex-wrap:wrap;gap:0;margin:16px 0 0;border:1px solid var(--line);border-radius:14px;background:var(--ink2);overflow:hidden}
dl.meta > div{padding:10px 16px;border-right:1px solid var(--line);min-width:0}
dl.meta > div:last-child{border-right:0}
dl.meta dt{font:700 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
dl.meta dd{margin:3px 0 0;font-weight:700;color:var(--text)}
dl.meta dd a{color:var(--soft);text-decoration:none}
@media (max-width:700px){dl.meta > div{flex:1 1 45%;border-bottom:1px solid var(--line)}}
.form-col{min-width:0}
.amount.big{font-size:20px;text-align:left;padding-top:6px}
.payrow{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.payrow:first-of-type{border-top:0}
.notice .btn{margin-left:6px}
.panel .notice{margin-bottom:0}

/* action bar */

  window.STUDIO = { email: '', signOut: () => auth.signOut().then(() => location.reload()) };
  btn.addEventListener('click', async () => {
    const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    btn.disabled = true; say('Signing in…');
    try { await auth.signInWithPopup(p); }
    catch (e) {
      if (e && /popup-blocked|operation-not-supported/.test(e.code)) return auth.signInWithRedirect(p);
      btn.disabled = false; say(e && e.code === 'auth/popup-closed-by-user' ? 'Sign-in was closed. Try again when you’re ready.' : 'Sign-in didn’t work. Check your connection and try again.', true);
    }
  });
  let started = false;
  auth.onAuthStateChanged(async u => {
    if (!u) { gate.hidden = false; btn.disabled = false; return; }
    say('Opening your workspace…'); btn.disabled = true;
    try { await fs.doc('settings/meta').get(); }
    catch (e) {
      if (e && e.code === 'permission-denied') { await auth.signOut(); gate.hidden = false; btn.disabled = false; say(u.email + ' doesn’t have access to Novyra Studio. Sign in with the Novyra account.', true); return; }
    }
    window.STUDIO.email = u.email || '';
    gate.hidden = true;
    if (!started) { started = true; resolveReady(); }
  });
  const downloads = { save: async ({ filename, data }) => {
    const url = URL.createObjectURL(data), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } };
  const user = { isOwner: async () => true, canEdit: async () => true };
  window.claude = { use: name => name === 'db' ? ready.then(() => fs) : name === 'user' ? ready.then(() => user) : name === 'downloads' ? Promise.resolve(downloads) : Promise.resolve(null) };
})();
</script>

/* ---------- money maths ---------- */
const unitOf = it => it.unit || (prices().find(x => x.item === it.item) || {}).unit || 'once-off';
const r2 = x => Math.round(x * 100) / 100;
function calc(doc) {
  const lines = (doc.items || []).filter(it => it.item).map(it => {
    const qty = Math.max(0, Number(it.qty) || 0), rate = Number(it.rate) || 0, disc = Math.min(1, Math.max(0, (Number(it.discount) || 0) / 100));
    return { ...it, qty, rate, disc, monthly: unitOf(it) === 'per month', gross: qty * rate, amount: qty * rate * (1 - disc) };
  });
  const pct = (Number(doc.rush) || 0) / 100;
  const subtotal = lines.reduce((a, l) => a + l.gross, 0);
  const afterDisc = lines.reduce((a, l) => a + l.amount, 0);
  const rush = afterDisc * pct;
  const total = r2(afterDisc + rush);
  const monthlyBase = r2(lines.filter(l => l.monthly).reduce((a, l) => a + l.amount, 0));
  const firstMonth = r2(monthlyBase * (1 + pct)), once = r2(total - firstMonth);
  // website policy: jobs under R1,000 upfront, otherwise 50% deposit; monthly packages paid monthly in advance
  const onceNow = once < 1000 ? once : r2(once / 2);
  const deposit = r2(onceNow + firstMonth);
  const paid = (doc.payments || []).reduce((a, p) => a + (Number(p.amount) || 0), 0);
  return { lines, subtotal, discount: afterDisc - subtotal, rush, total, once, firstMonth, monthlyBase, deposit, balance: r2(total - deposit), paid, due: r2(total - paid) };
}

function quoteStatus(q) { if (q.status === 'Open' && q.validUntil && todayIso() > q.validUntil) return 'Expired'; return q.status || 'Draft'; }
function invoiceStatus(v) {
  if (v.status === 'Cancelled') return 'Cancelled';
  if (v.status !== 'Sent') return 'Draft';
  const c = calc(v);
  if (c.due <= 0) return 'Paid';
  if (v.dueDate && todayIso() > v.dueDate) return 'Overdue';
  return c.paid > 0 ? 'Part paid' : 'Unpaid';
}

function describeChanges(before, after) {
  const out = [];
  const b = new Map((before.items || []).filter(i => i.item).map(i => [i.item, i]));
  const a = new Map((after.items || []).filter(i => i.item).map(i => [i.item, i]));
  for (const [k, it] of a) if (!b.has(k)) out.push(`Added ${k} (${it.qty} × ${money0(it.rate)})`);
  for (const [k] of b) if (!a.has(k)) out.push(`Removed ${k}`);
  for (const [k, it] of a) {
    const o = b.get(k); if (!o) continue;
    if (Number(o.qty) !== Number(it.qty)) out.push(`${k}: quantity ${o.qty} → ${it.qty}`);
    if (Number(o.rate) !== Number(it.rate)) out.push(`${k}: price ${money0(o.rate)} → ${money0(it.rate)}`);
    if ((Number(o.discount) || 0) !== (Number(it.discount) || 0)) out.push(`${k}: discount ${Number(o.discount) || 0}% → ${Number(it.discount) || 0}%`);
    if ((o.details || '') !== (it.details || '')) out.push(`${k}: details changed`);
  }
  if ((Number(before.rush) || 0) !== (Number(after.rush) || 0)) out.push(`Rush fee ${Number(before.rush) || 0}% → ${Number(after.rush) || 0}%`);
  if (before.date !== after.date) out.push(`Date ${fmtDate(before.date)} → ${fmtDate(after.date)}`);
  if (before.validUntil !== after.validUntil) out.push(`Valid until ${fmtDate(before.validUntil)} → ${fmtDate(after.validUntil)}`);
  if (before.dueDate !== after.dueDate && (before.dueDate || after.dueDate)) out.push(`Due date ${fmtDate(before.dueDate)} → ${fmtDate(after.dueDate)}`);
  const bc = before.client || {}, ac = after.client || {};
  if (norm(bc.business) !== norm(ac.business)) out.push(`Customer ${bc.business || '(none)'} → ${ac.business || '(none)'}`);
  else {
    const bn = contactsOf(bc).map(p => p.name).join(', '), an = contactsOf(ac).map(p => p.name).join(', ');
    if (bn !== an) out.push(`Addressed to ${an || '(no one)'} (was ${bn || 'no one'})`);
    else if (JSON.stringify(bc) !== JSON.stringify(ac)) out.push('Client details updated');
  }
  if ((before.notes || '') !== (after.notes || '')) out.push('Notes changed');
  const t0 = calc(before).total, t1 = calc(after).total;
  if (t0 !== t1) out.push(`Total ${money(t0)} → ${money(t1)}`);
  return out;
}

/* ---------- backup ---------- */
async function backup() {
  const downloads = await claude.use('downloads');
  if (!downloads) { toast('Downloads aren’t available in this view.'); return; }
  const strip = a => a.map(({ id, ...d }) => ({ id, ...d }));
  const data = { app: 'Novyra Quotes & Invoices', made: new Date().toISOString(), clients: strip(state.clients), quotes: strip(state.quotes), invoices: strip(state.invoices), prices: state.prices, bank: state.bank };
  const name = `Novyra Backup ${todayIso()}.json`;
  try {
    await downloads.save({ filename: name, data: new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }) });
    await db.doc('settings/meta').set({ ...(state.meta || {}), lastBackup: new Date().toISOString() });
    toast('Saved ' + name);
  } catch (e) { toast(e && e.code === 'declined' ? 'Backup cancelled.' : 'The backup couldn’t be saved here.'); }
}
async function restoreDialog(file) {
  let data; try { data = JSON.parse(await file.text()); } catch { toast('That file isn’t a Novyra backup.'); return; }
  if (!data || data.app !== 'Novyra Quotes & Invoices') { toast('That file isn’t a Novyra backup.'); return; }
  const missing = (arr, have) => (arr || []).filter(x => x && x.id && !have.some(h => h.id === x.id));
  const add = { clients: missing(data.clients, state.clients), quotes: missing(data.quotes, state.quotes), invoices: missing(data.invoices, state.invoices) };
  const extra = [];
  if (!state.prices && data.prices && Array.isArray(data.prices.items)) extra.push(['settings/prices', data.prices, 'your price list']);
  if (!state.bank && data.bank && data.bank.accountNumber) extra.push(['settings/bank', data.bank, 'your payment details']);
  const n = add.clients.length + add.quotes.length + add.invoices.length + extra.length;
  openModal(dlg('Restore from backup', `<p class="lead">Backup made <b>${esc(fmtWhen(data.made))}</b>.</p>
      ${n ? `<p>This puts back <b>${add.clients.length} client${add.clients.length === 1 ? '' : 's'}</b>, <b>${add.quotes.length} quote${add.quotes.length === 1 ? '' : 's'}</b> and <b>${add.invoices.length} invoice${add.invoices.length === 1 ? '' : 's'}</b>${extra.length ? ', plus ' + extra.map(x => x[2]).join(' and ') : ''} that are missing now.</p><p class="sub">Nothing you have now is changed or replaced; only missing records are added back.</p>`
        : '<p>Everything in this backup is already in your workspace. Nothing needs restoring.</p>'}`,
    `<button class="btn ghost" data-close>${n ? 'Cancel' : 'Close'}</button>${n ? '<button class="btn primary" data-do-restore>Restore missing records</button>' : ''}`), m => {
    const b = $('[data-do-restore]', m); if (!b) return;
    b.addEventListener('click', async () => {
      b.disabled = true;
      try { for (const [colName, list] of Object.entries(add)) for (const d of list) await save(colName, d); for (const [p, v] of extra) await db.doc(p).set(JSON.parse(JSON.stringify(v))); closeModal(); toast(`${n} record${n === 1 ? '' : 's'} restored`); }
      catch { b.disabled = false; toast('Restoring stopped part-way. Check your connection and try again; nothing is overwritten.'); }
    });
  });
}

async function newDoc(kind, from, client, chosen) {
  const id = uid(), now = new Date().toISOString(), d = todayIso(), by = OWNER.name;
  let doc;
  if (kind === 'quote') {
    const cl = client ? clientSnap(client, chosen) : from ? clone(from.client) : {};
    doc = { id, number: nextQuote(), rev: 1, status: 'Draft', date: d, validUntil: addDays(d, 30), clientId: client ? client.id : from ? from.clientId || null : null, client: cl,
      items: [{ item: '', details: '', qty: 1, rate: 0, discount: 0 }], rush: 0, notes: '', createdBy: by, createdAt: now, updatedAt: now,
      history: [{ at: now, rev: 1, title: from ? `Created by ${by} for extra work on ${qRef(from)}` : `Quote created by ${by}`, changes: [] }] };
  } else {
    if (!from || from.status !== 'Accepted') { toast('Invoices are made from an accepted quote.'); return; }
    doc = { id, number: null, status: 'Draft', date: d, dueDate: d, quoteId: from.id, quoteRef: qRef(from), clientId: from.clientId || null, client: clone(from.client), items: clone(from.items), rush: from.rush || 0, notes: '', payments: [], createdBy: by, createdAt: now, updatedAt: now,
      history: [{ at: now, title: `Invoice drafted by ${by} from ${qRef(from)}`, changes: [] }] };
  }
  try { await save(kind === 'quote' ? 'quotes' : 'invoices', doc); }
  catch { toast('That couldn’t be created. Check your connection and try again.'); return; }
  (kind === 'quote' ? state.quotes : state.invoices).push(doc);
  closeModal(); go(`${kind}-${id}`);
}

function closeModal() { const m = $('#modal'); if (m.hidden) return; m.hidden = true; m.innerHTML = ''; document.body.style.overflow = ''; if (modalKeys) removeEventListener('keydown', modalKeys); modalKeys = null; }
const dlg = (title, body, foot, size) => `<div class="dialog ${size || ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><button class="x" data-close aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Back</button><h3>${esc(title)}</h3></header><div class="content">${body}</div><footer>${foot}</footer></div>`;

/* customer picker: type a name, pick a saved client, or add a new one */
function comboHTML(value) {
  return `<div class="combo"><input class="cust" role="combobox" aria-label="Customer" aria-autocomplete="list" aria-expanded="false" autocomplete="off" value="${esc(value || '')}" placeholder="Start typing the client’s name">
    <button type="button" class="btn icon" data-combo-add title="Add a new client" aria-label="Add a new client"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><ul class="combo-list" role="listbox" hidden></ul></div>`;
}
function bindCombo(root, onPick, onAdd) {
  const inp = $('.cust', root), list = $('.combo-list', root); if (!inp) return;
  let items = [], active = -1;
  const draw = () => {
    const q = norm(inp.value);
    items = state.clients.filter(c => !q || [c.business, ...contactsOf(c).flatMap(p => [p.name, p.email])].some(x => norm(x).includes(q))).slice(0, 7).map(c => ({ c }));
    if (q && !state.clients.some(c => norm(c.business) === q)) items.push({ add: inp.value.trim() });
    if (!items.length) list.innerHTML = `<li class="none">${state.clients.length ? 'No saved client matches.' : 'No clients saved yet. Press + to add one.'}</li>`;
    else list.innerHTML = items.map((x, i) => x.c
      ? `<li role="option" data-i="${i}" aria-selected="${i === active}"><span class="av">${esc(initials(x.c.business))}</span><span><b>${esc(x.c.business)}</b><span class="sub">${esc(contactsOf(x.c).map(p => p.name || p.email).filter(Boolean).join(', ') || 'No contact person yet')}</span></span></li>`
      : `<li role="option" class="add" data-i="${i}" aria-selected="${i === active}"><span class="av">+</span><span><b>Add “${esc(x.add)}” as a new client</b><span class="sub">Save their details once, use them on every quote</span></span></li>`).join('');
    list.hidden = false; inp.setAttribute('aria-expanded', 'true');
  };
  const hide = () => { list.hidden = true; inp.setAttribute('aria-expanded', 'false'); active = -1; };
  const choose = i => { const x = items[i]; if (!x) return; hide(); if (x.c) { inp.value = x.c.business; onPick(x.c); } else onAdd(x.add); };
  inp.addEventListener('focus', () => { if (inp.value.trim()) draw(); });
  inp.addEventListener('input', () => { if (!inp.value.trim()) return hide(); active = 0; draw(); });
  inp.addEventListener('blur', () => setTimeout(hide, 150));
  inp.addEventListener('keydown', e => {
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && inp.value.trim()) { e.preventDefault(); if (list.hidden) draw(); if (items.length) active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (list.hidden) return; if (active < 0 && items.length) active = 0; choose(active); }
    else if (e.key === 'Escape' && !list.hidden) { e.preventDefault(); hide(); }
  });
  list.addEventListener('mousedown', e => { const li = e.target.closest('[data-i]'); if (li) { e.preventDefault(); choose(Number(li.dataset.i)); } });
  $('[data-combo-add]', root).addEventListener('click', () => onAdd(inp.value.trim()));
}
function contactPicks(all, chosen, locked) {

/* add or edit a client, with one or more contact people */
function clientDialog(c, onSaved, onCancel) {
  const isNew = !c || !c.id;
  let x = { business: '', address: '', reg: '', notes: '', ...(c || {}) };
  let people = clone(contactsOf(c));
  if (!people.length) people = [{ name: '', role: '', email: '', phone: '' }];
  const docs = isNew ? { quotes: [], invoices: [] } : docsFor(x);
  const list = [...docs.quotes.map(q => ({ h: `quote-${q.id}`, n: qRef(q), d: q.date, t: calc(q).total, s: quoteStatus(q) })), ...docs.invoices.map(v => ({ h: `invoice-${v.id}`, n: v.number ? 'INV-' + v.number : 'Draft invoice', d: v.date, t: calc(v).total, s: invoiceStatus(v) }))].sort((a, b) => (b.d || '').localeCompare(a.d || ''));

      <label class="field"><span>Email</span><input data-pf="email" type="email" value="${esc(p.email)}" placeholder="name@company.co.za"></label><label class="field"><span>Phone</span><input data-pf="phone" type="tel" value="${esc(p.phone)}"></label></div></div>`;
  const body = () => `<div class="section"><label class="field"><span>Business name</span><input id="cl-business" value="${esc(x.business)}" ${isNew ? 'autofocus' : ''}></label></div>
    <div class="section"><div class="sec-h"><span class="label">Contact people</span><span class="sub">Quotes are addressed and emailed to them</span></div><div class="pcards">${people.map(personHTML).join('')}</div>

    <div class="section grid2"><label class="field" style="grid-column:1/-1"><span>Address (optional)</span><textarea id="cl-address" rows="2">${esc(x.address)}</textarea></label>
      <label class="field" style="grid-column:1/-1"><span>Registration or VAT no. (optional)</span><input id="cl-reg" value="${esc(x.reg)}"></label>

  const canRemove = !isNew && !list.length;
  const foot = `${canRemove ? '<button class="btn ghost danger" data-remove-client style="margin-right:auto">Remove client</button>' : ''}${isNew || onSaved ? '' : '<button class="btn" data-quote-client style="margin-right:auto">New quote for this client</button>'}<button class="btn ghost" data-cancel>Cancel</button><button class="btn primary" data-save-client>${isNew ? 'Save client' : 'Save changes'}</button>`;
  const readAll = m => {

    $('[data-cancel]', m).addEventListener('click', cancel);
    $('.x', m).onclick = e => { e.stopPropagation(); cancel(); };
    $$('[data-go]', m).forEach(a => a.addEventListener('click', closeModal));
    $('[data-add-person]', m).addEventListener('click', () => { readAll(m); people.push({ name: '', role: '', email: '', phone: '' }); draw(); const last = $$('#modal .pcard').pop(); if (last) { last.scrollIntoView({ block: 'nearest' }); $('input', last).focus(); } });
    $$('[data-del-person]', m).forEach(b => b.addEventListener('click', () => { readAll(m); people.splice(Number(b.dataset.delPerson), 1); draw(); }));
    $('[data-save-client]', m).addEventListener('click', async e => {

      const bad = ppl.findIndex(p => p.email && !/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(p.email));
      if (bad >= 0) { toast('One of the email addresses doesn’t look right.'); $$('.pcard', m)[people.indexOf(ppl[bad])].querySelector('[data-pf=email]').focus(); return; }

      const btn = e.currentTarget; btn.disabled = true;

      try { await db.collection('clients').doc(id).set(rec); }

      });
    });
  });
  draw();
}

          ${!locked && Q ? comboHTML(cl.business) : ''}
          ${cl.business ? `<div class="pickcard" style="margin-top:${!locked && Q ? 12 : 0}px"><div class="pc-head"><span class="av">${esc(initials(cl.business))}</span><b>${esc(cl.business)}</b>${!locked && rec ? `<button class="btn small ghost" data-act="edit-client">Edit client</button>` : ''}</div>
            ${recPeople.length ? `${recPeople.length > 1 && !locked ? '<p class="sub" style="margin:0 0 6px">Addressed and emailed to everyone ticked.</p>' : ''}${contactPicks(locked ? contactsOf(cl) : recPeople, contactsOf(cl), locked)}` : `<p class="sub" style="margin:0">No contact person saved.${!locked && rec ? ' Use Edit client to add one.' : ''}</p>`}
            ${cl.address ? `<p class="sub" style="margin:8px 0 0">${esc(cl.address)}</p>` : ''}</div>`
            : `<p class="sub" style="margin:10px 0 0">Type a saved client’s name to fill in their details, or press + to add a new client.</p>`}
          ${stale ? `<div class="notice warn">This client’s saved details changed since this ${Q ? 'quote' : 'invoice'} was made. <button class="btn small" data-act="client-latest">Use the latest details</button></div>` : ''}
          ${!locked && cl.business && !rec ? `<div class="notice">${esc(cl.business)} isn’t saved as a client yet. <button class="btn small" data-act="save-as-client">Save as client</button></div>` : ''}
        </section>
        <section class="panel"><h3>Dates</h3><div class="grid2">
          <label class="field"><span>${Q ? 'Quote date' : 'Invoice date'}</span><input type="date" id="f-date" value="${d.date || ''}" ${locked ? 'disabled' : ''}></label>
          <label class="field"><span>${Q ? 'Valid until' : 'Due date'}</span><input type="date" id="f-until" value="${(Q ? d.validUntil : d.dueDate) || ''}" ${locked ? 'disabled' : ''}></label></div>
          <p class="sub" style="margin:8px 0 0">${Q ? "30 days after the quote date. Pick an earlier date if a printer's quote runs out sooner." : 'Payment is due on approval, so this is the invoice date unless you agree otherwise.'}</p></section>
        <section class="panel"><h3>Items ${locked ? '' : `<button class="btn small" data-act="add-item">+ Add item</button>`}</h3>${itemHTML || '<p class="muted">No items yet.</p>'}
          <datalist id="price-items">${opts}</datalist>
          <div class="grid2" style="margin-top:12px"><label class="field"><span>Rush fee</span><select id="f-rush" ${locked ? 'disabled' : ''}>
            ${[[0, 'None'], [25, '25% · under 5 working days'], [50, '50% · within 48 hours']].map(([v, l]) => `<option value="${v}" ${Number(d.rush || 0) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
            <div class="field"><span>${Q ? 'Total' : 'Amount due'}</span><div class="amount num big">${money(Q ? c.total : c.due)}</div></div></div>
          <label class="field" style="margin-top:12px"><span>Notes on the ${Q ? 'quote' : 'invoice'} (optional, printed)</span><textarea id="f-notes" ${locked ? 'disabled' : ''}>${esc(d.notes)}</textarea></label></section>
        ${!Q && (d.payments || []).length ? `<section class="panel"><h3>Payments</h3>${d.payments.map(p => `<div class="payrow"><span>${fmtDate(p.date)}${p.note ? ' · ' + esc(p.note) : ''}</span><b class="num">${money(p.amount)}</b></div>`).join('')}</section>` : ''}
        <section class="panel"><h3>History</h3>${hist ? `<ul class="timeline">${hist}</ul>` : '<p class="sub" style="margin:0">Changes, emails and payments will be listed here.</p>'}</section>
      </div>
      <div class="preview"><div class="preview-bar"><span class="label">Preview</span><span class="sub">${pages.length} page${pages.length === 1 ? '' : 's'} · A4</span></div><div class="preview-frame">${pages.map(p => `<div class="paper-holder"><div class="paper-scale">${p}</div></div>`).join('')}</div></div>
    </div>
    <div class="actionbar"><div class="actions">${actions}</div></div>`;
  fitPreview();
  bindEditor(main);
}

function bindEditor(main) {
  const E = view.edit, d = E.draft, Q = E.kind === 'quote';
  const rerender = () => { const y = scrollY; renderEditor(main); scrollTo(0, y); };
  const onField = (sel, fn) => { const el = $(sel, main); if (el) el.addEventListener('change', () => { fn(el.value); rerender(); }); };
  onField('#f-date', v => { if (Q && d.date && d.validUntil === addDays(d.date, 30)) d.validUntil = addDays(v, 30); if (!Q && d.dueDate === d.date) d.dueDate = v; d.date = v; });
  onField('#f-until', v => { if (Q) d.validUntil = v; else d.dueDate = v; });
  onField('#f-rush', v => d.rush = Number(v));
  onField('#f-notes', v => d.notes = v);
  const useClient = c => { d.clientId = c.id; d.client = clientSnap(c); rerender(); };
  bindCombo(main, useClient, name => clientDialog({ business: name }, c => { closeModal(); useClient(c); }));
  $$('[data-person]', main).forEach(cb => cb.addEventListener('change', () => {
    const rec = state.clients.find(x => x.id === d.clientId), all = rec ? contactsOf(rec) : contactsOf(d.client);
    const sel = $$('[data-person]', main).filter(x => x.checked).map(x => all[Number(x.dataset.person)]);
    if (!sel.length) { cb.checked = true; toast('Keep at least one contact person.'); return; }
    d.client = clientSnap(rec || d.client, sel); rerender();
  }));
  $$('.item', main).forEach(box => {
    const it = d.items[Number(box.dataset.i)];
    $$('[data-f]', box).forEach(inp => inp.addEventListener('change', () => {
      const f = inp.dataset.f;
      if (f === 'item') { it.item = inp.value.trim(); const p = prices().find(x => x.item === it.item); if (p) { it.rate = p.price; it.details = p.details; it.unit = p.unit; } }
      else if (f === 'qty') it.qty = Math.max(1, Math.round(Number(inp.value) || 1));
      else if (f === 'rate') it.rate = Math.max(0, Number(inp.value) || 0);
      else if (f === 'discount') it.discount = Math.min(100, Math.max(0, Number(inp.value) || 0));
      else it[f] = inp.value;
      rerender();
    }));
    $$('[data-step]', box).forEach(b => b.addEventListener('click', () => { it.qty = Math.max(1, (Number(it.qty) || 1) + Number(b.dataset.step)); rerender(); }));
  });
  $$('[data-remove]', main).forEach(b => b.addEventListener('click', () => { d.items.splice(Number(b.dataset.remove), 1); rerender(); }));
  $$('[data-act]', main).forEach(b => b.addEventListener('click', () => act(b.dataset.act)));
  const mail = $('[data-mail]', main);
  if (mail) mail.addEventListener('click', () => {
    // the link itself opens Mail; at the same time save the PDF so it can be attached
    E.mailed = true; const now = new Date().toISOString();
    d.history.push({ at: now, title: `Email opened in Mail to ${listAnd(toList(d))}`, note: emailDraft(d, Q).subject, changes: [] });
    setTimeout(async () => { render(); const ok = await downloadPDF(d, E.kind); if (ok) d.history.push({ at: new Date().toISOString(), title: `PDF saved for the email (${pdfName(d, E.kind)})`, changes: [] }); await persist(); }, 60);
  });
}

async function persist(note) {
  const E = view.edit; if (!E) return false;
  const prev = E.draft.updatedAt; E.draft.updatedAt = new Date().toISOString();
  try { await save(E.kind === 'quote' ? 'quotes' : 'invoices', E.draft); }
  catch { E.draft.updatedAt = prev; toast('Not saved. Check your connection and try again; your changes are still here.'); render(); return false; }
  E.saved = clone(E.draft); closeModal(); render(); if (note) toast(note); return true;
}

/* ---------- email text ---------- */
function emailDraft(d, Q) {
  const names = recipients(d).map(p => firstName(p.name)).filter(Boolean);
  const hi = names.length ? `Hi ${listAnd(names)},` : 'Hi there,';
  const cl = d.client || {}, sign = 'Kind regards\nNovyra';
  if (Q) {
    const rev = (d.rev || 1) > 1;
    return { subject: `Novyra quote ${qRef(d)}${cl.business ? ' – ' + cl.business : ''}`,
      body: `${hi}\n\n${rev ? `Please find attached the updated quote ${qRef(d)}. It replaces the earlier version.` : `Thank you for the opportunity. Please find attached quote ${qRef(d)}.`}\n\nTo go ahead, simply reply to this email. Let me know if you have any questions.\n\n${sign}` };
  }
  return { subject: `Novyra invoice INV-${d.number}${cl.business ? ' – ' + cl.business : ''}`,
    body: `${hi}\n\nPlease find attached invoice INV-${d.number}. Please use INV-${d.number} as the payment reference.\n\nThank you for choosing Novyra.\n\n${sign}` };
}

/* ---------- actions and confirmations (all as proper dialogs) ---------- */
function confirmDialog(cf) {
  const E = view.edit, d = E.draft, c = calc(d);
  const spec = {
    rev: ['Save as a new revision', `<p class="lead">${esc(qRef(d))} was already sent, so saving makes it <b>Rev ${(d.rev || 1) + 1}</b>. The history keeps what changed.</p>
      <ul class="changes">${describeChanges(E.saved, d).map(x => `<li>${esc(x)}</li>`).join('') || '<li>No changes</li>'}</ul>
      <label class="field"><span>Why did it change? (optional, kept in the history)</span><input id="cf-note" placeholder="For example: client added a letterhead"></label>`, `Save as Rev ${(d.rev || 1) + 1}`],
    renew: ['Renew quote', `<p class="lead">Renew ${esc(qRef(d))} as <b>Rev ${(d.rev || 1) + 1}</b>, dated today and valid for 30 days.</p><p class="sub">Every listed item moves to today's price list. The history keeps the old prices.</p>`, 'Renew quote'],
    sent: ['Mark as sent', `<p class="lead">Mark ${esc(qRef(d))} as sent to ${esc(cl(d))}?</p><p class="sub">From now on, changes are saved as new revisions so you always know what the client saw.</p>`, 'Mark as sent'],
    accept: ['Client accepted', `<p class="lead">${esc(cl(d))} accepted <b>${esc(qRef(d))}</b>?</p><p class="sub">The quote is locked after this. Before you start, ask for ${money(c.deposit)}: ${c.firstMonth && c.once ? (c.once < 1000 ? 'the full job plus the first month' : 'the 50% deposit plus the first month') : c.firstMonth ? 'the first month, paid in advance' : c.total < 1000 ? 'the full amount, paid upfront' : 'the 50% deposit'}.</p>`, 'Yes, accepted'],
    decline: ['Client declined', `<p class="lead">${esc(cl(d))} declined <b>${esc(qRef(d))}</b>?</p><p class="sub">The quote is locked after this.</p>`, 'Yes, declined'],
    send: ['Issue invoice', `<p class="lead">Issue this invoice as <b>INV-${nextInvoice()}</b> for ${money(c.total)}?</p><p class="sub">The number is fixed and the invoice is locked. Then email it to the client; you can still record payments or cancel it.</p>`, `Issue INV-${nextInvoice()}`],
    pay: ['Record payment', `<div class="grid2"><label class="field"><span>Amount (R)</span><input id="cf-amount" type="number" min="0" step="0.01" value="${Math.max(0, c.due).toFixed(2)}" autofocus></label>
      <label class="field"><span>Date paid</span><input id="cf-date" type="date" value="${todayIso()}"></label></div>
      <label class="field"><span>Note (optional)</span><input id="cf-note" placeholder="For example: deposit"></label><p class="sub" style="margin:0">Still owed before this payment: ${money(c.due)}</p>`, 'Record payment'],
    cancel: ['Cancel invoice', `<p class="lead">Cancel <b>INV-${d.number}</b>?</p><p class="sub">The number stays in your records as cancelled. If the client still owes money, create a new invoice from the quote.</p>
      <label class="field"><span>Reason (kept in the history)</span><input id="cf-note" placeholder="For example: wrong amount"></label>`, 'Cancel invoice', true],
    delete: ['Delete draft', `<p class="lead">Delete this draft ${E.kind}?</p><p class="sub">It was never sent, so nothing is lost from your records. This can't be undone.</p>`, 'Delete draft', true],
  }[cf];
  openModal(dlg(spec[0], spec[1], `<button class="btn ghost" data-close>${cf === 'cancel' ? 'Keep invoice' : 'Back'}</button><button class="btn ${spec[3] ? 'danger-solid' : 'primary'}" data-confirm="${cf}">${spec[2]}</button>`, 'small'), m => {
    $('[data-confirm]', m).addEventListener('click', e => { e.currentTarget.disabled = true; confirmAct(cf).finally(() => { const b = $('[data-confirm]', m); if (b) b.disabled = false; }); });
  });
}
const cl = d => (d.client && d.client.business) || 'The client';

async function act(a) {
  const E = view.edit, d = E.draft, Q = E.kind === 'quote', now = new Date().toISOString();
  if (a === 'add-item') { d.items.push({ item: '', details: '', qty: 1, rate: 0, discount: 0 }); render(); const last = $$('.item').pop(); if (last) $('input', last).focus(); return; }
  if (a === 'save') {
    if (Q && d.status !== 'Draft') return confirmDialog('rev');
    const changes = describeChanges(E.saved, d);
    if (changes.length) d.history.push({ at: now, title: 'Draft saved', changes });
    return persist('Saved');
  }
  if (a === 'pdf') {
    if (isDirty()) { toast('Save your changes first, so the PDF matches your records.'); return; }
    const ok = await downloadPDF(d, E.kind);
    if (ok) { d.history.push({ at: now, title: `PDF downloaded (${docNo(d, E.kind)})`, changes: [] }); await persist(); }
    return;
  }
  if (a === 'no-email') {
    const rec = state.clients.find(x => x.id === d.clientId) || state.clients.find(x => norm(x.business) === norm(d.client && d.client.business));
    openModal(dlg('No email address yet', `<p class="lead">${esc(cl(d))} has no email address saved${contactsOf(d.client).length ? ' for the people this is addressed to' : ''}.</p><p class="sub">Add one to the client, then press Email to client again.</p>`,
      `<button class="btn ghost" data-close>Close</button>${rec ? '<button class="btn primary" data-fix>Edit client</button>' : ''}`, 'small'), m => { const f = $('[data-fix]', m); if (f) f.addEventListener('click', () => clientDialog(rec, () => { closeModal(); render(); })); });
    return;
  }
  if (a === 'mail-sent') {
    E.mailed = false;
    d.history.push({ at: now, rev: Q ? d.rev || 1 : undefined, title: `Emailed to ${listAnd(toList(d))}`, changes: [] });
    if (Q && d.status === 'Draft') { d.status = 'Open'; d.sentAt = now; d.history.push({ at: now, rev: d.rev || 1, title: `Sent to the client (${qRef(d)})`, total: calc(d).total, changes: [] }); }
    return persist(Q && d.sentAt === now ? 'Marked as sent' : 'Logged in the history');
  }
  if (a === 'copy-mail') {
    const m = emailDraft(d, Q), text = `To: ${toList(d).join(', ')}\nSubject: ${m.subject}\n\n${m.body}`;
    try { await navigator.clipboard.writeText(text); toast('Email copied. Paste it into a new email in Mail.'); }
    catch { openModal(dlg('Copy the email', `<p class="sub" style="margin:0">Select all and press ⌘C, then paste it into a new email.</p><textarea rows="16" readonly autofocus>${esc(text)}</textarea>`, '<button class="btn primary" data-close>Done</button>', 'wide'), mm => $('textarea', mm).select()); }
    return;
  }
  if (a === 'mail-close') { E.mailed = false; return render(); }
  if (a === 'edit-client' || a === 'save-as-client') {
    const base = a === 'edit-client' ? state.clients.find(x => x.id === d.clientId) : { business: d.client.business, contacts: contactsOf(d.client), address: d.client.address, reg: d.client.reg };
    return clientDialog(base, c => { closeModal(); d.clientId = c.id; d.client = clientSnap(c, contactsOf(d.client)); render(); });
  }
  if (a === 'client-latest') { const r = state.clients.find(x => x.id === d.clientId); if (r) d.client = clientSnap(r, contactsOf(d.client)); return render(); }
  if (a === 'invoice') return newDoc('invoice', d);
  if (a === 'extra') return newDoc('quote', d, state.clients.find(x => x.id === d.clientId), contactsOf(d.client));
  if (a === 'send' && isDirty()) { toast('Save your changes first.'); return; }
  confirmDialog(a);
}
async function confirmAct(cf) {
  const E = view.edit, d = E.draft, now = new Date().toISOString();
  const note = ($('#cf-note') || {}).value?.trim() || '';
  if (cf === 'rev') {
    const changes = describeChanges(E.saved, d);
    d.rev = (d.rev || 1) + 1; d.status = 'Open';
    d.history.push({ at: now, rev: d.rev, title: `Rev ${d.rev} saved`, total: calc(d).total, note, changes });
    return persist(`Saved as Rev ${d.rev}. Email the new version to the client.`);
  }
  if (cf === 'renew') {
    const before = clone(d);
    d.items.forEach(it => { const p = prices().find(x => x.item === it.item); if (p) { it.rate = p.price; it.unit = p.unit; if (p.details) it.details = p.details; } });
    d.date = todayIso(); d.validUntil = addDays(d.date, 30); d.rev = (d.rev || 1) + 1; d.status = 'Open';
    d.history.push({ at: now, rev: d.rev, title: `Renewed as Rev ${d.rev} at today's prices`, total: calc(d).total, changes: describeChanges(before, d) });
    return persist(`Renewed as Rev ${d.rev}. Email the new version to the client.`);
  }
  if (cf === 'sent') { d.status = 'Open'; d.sentAt = now; d.history.push({ at: now, rev: d.rev || 1, title: `Sent to the client (${qRef(d)})`, total: calc(d).total, changes: [] }); return persist('Marked as sent'); }
  if (cf === 'accept' || cf === 'decline') {
    const st = cf === 'accept' ? 'Accepted' : 'Declined';
    d.status = st; d.decidedAt = now; d.history.push({ at: now, rev: d.rev || 1, title: `${st} by the client (${qRef(d)})`, total: calc(d).total, changes: [] });
    return persist(st === 'Accepted' ? 'Accepted. Create the invoice when you need it.' : 'Marked as declined');
  }
  if (cf === 'send') {
    d.number = nextInvoice(); d.status = 'Sent'; d.sentAt = now;
    d.history.push({ at: now, title: `Issued as INV-${d.number}`, total: calc(d).total, changes: [] });
    const ok = await persist(`Issued as INV-${d.number}. Now email it to the client.`);
    if (!ok) { d.number = null; d.status = 'Draft'; d.history.pop(); }
    return;
  }
  if (cf === 'pay') {
    const amount = Math.round((Number($('#cf-amount').value) || 0) * 100) / 100, date = $('#cf-date').value || todayIso();
    if (amount <= 0) { toast('Type the amount that was paid.'); return; }
    d.payments = d.payments || []; d.payments.push({ amount, date, note });
    d.history.push({ at: now, title: `Payment of ${money(amount)} recorded`, note, changes: [`Paid on ${fmtDate(date)}`, `Still owed: ${money(calc(d).due)}`] });
    return persist(calc(d).due <= 0 ? 'Paid in full. Send the final files.' : 'Payment recorded');
  }
  if (cf === 'cancel') { d.status = 'Cancelled'; d.history.push({ at: now, title: `INV-${d.number} cancelled`, note, changes: [] }); return persist('Invoice cancelled'); }
  if (cf === 'delete') {
    const colName = E.kind === 'quote' ? 'quotes' : 'invoices';
    if (E.kind === 'quote' ? d.status !== 'Draft' : d.status !== 'Draft') { toast('Only drafts can be deleted.'); return; }
    try { await db.collection(colName).doc(d.id).delete(); } catch { toast('Not deleted. Check your connection.'); return; }
    closeModal(); view.edit = null; view.leaving = true; toast('Draft deleted'); go(colName); return;
  }
}

if (location.hash !== '#home') history.replaceState(null, '', '#home');
route(); boot();
})();
</script>
</body></html>
