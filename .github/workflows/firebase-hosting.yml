# Puts the website on Firebase Hosting every time something is pushed to main.
# It stays switched off until the repository variable FIREBASE_HOSTING_READY is set to true.
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ vars.FIREBASE_HOSTING_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOVYRA_STUDIO }}
          channelId: live
          projectId: novyra-studio
