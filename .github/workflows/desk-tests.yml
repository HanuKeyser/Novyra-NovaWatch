name: Novyra Desk tests
# Starts Firebase's local database and sign-in emulators, then checks the security rules
# and uses the real app (desk-site/) as Novyra, as another company, as a team member and as a customer.
on:
  workflow_dispatch:
  push:
    paths: ['desk-site/**', 'firestore.rules', 'tests/**', '.github/workflows/desk-tests.yml', '**/AeroStack*', 'assets/img/aerostack-*']
# a newer push replaces a run that's still going
concurrency: { group: desk-tests, cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults: { run: { working-directory: tests } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: AeroStack's email signature files are untouched (they must never change or be deleted)
        working-directory: .
        run: sha256sum -c tests/aerostack.sha256
      - run: npm install --no-audit --no-fund
      - name: Install browsers (retries if Ubuntu's download servers are slow)
        timeout-minutes: 15
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          for i in 1 2 3; do timeout 270 npx playwright install --with-deps chromium firefox webkit && exit 0; echo "Browser install attempt $i didn't finish, trying again"; sleep 15; done; exit 1
      - run: cp ../firestore.rules firestore.rules
      - run: npx firebase emulators:exec --project novyra-studio --only firestore,auth "node rules.test.mjs && node e2e.mjs && node functions.mjs && node browsers.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: tests/shots }
