name: Novyra Desk tests
# Starts Firebase's local database and sign-in emulators, then checks the security rules
# and uses the real app (desk-site/) as Novyra, as another company, as a team member and as a customer.
on:
  workflow_dispatch:
  push:
    paths: ['desk-site/**', 'firestore.rules', 'tests/**', '.github/workflows/desk-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: tests } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: cp ../firestore.rules firestore.rules
      - run: npx firebase emulators:exec --project novyra-studio --only firestore,auth "node rules.test.mjs && node e2e.mjs && node functions.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: tests/shots }
